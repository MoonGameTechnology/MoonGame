name: Android APK (prototype)

# Builds release APKs of the prototype by wrapping the self-contained
# prototype HTML in a Capacitor WebView (branded icon/splash, rotates freely).
# TWO APKs from one matrix (см. prototype/build.mjs — профили клиента):
#   • dev    — the full dev client (test mode, single-player, time controls);
#     rolling "alpha" release, appId com.voiddominion.prototype (как раньше).
#   • player — the player client (no dev affordances; match browser is the main
#     path); rolling "player" release, appId com.voiddominion.player — свой
#     applicationId, so a host can install BOTH side by side.
# Each APK's in-app updater checks ITS OWN release lane (prototype/src/updater.ts
# resolves tag/asset from the baked __PLAYER_BUILD__ define).
# Runs on GitHub's ubuntu runner, which has the Android SDK preinstalled. On main it
# also publishes each APK to its rolling prerelease for a stable download link;
# every run still uploads the APKs as build artifacts too.
#
# Signing. The build job produces an UNSIGNED, non-debuggable release APK and never sees
# a key. Only the protected main publication job signs it, with the private release
# keystore from the `android-release` environment. The public debug keystore used before
# made Play Protect flag every install as suspicious (a well-known key, debuggable build).
# Actions are SHA-pinned (SD-6.1 / F-16); the trailing `# vN` comments track versions.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  push:
    # Branch candidates compile with the real SDK but cannot sign site manifests.
    # Only the protected main publication job receives the release key.
    branches: [main, claude/project-thread-asxd8m]
    paths:
      - 'prototype/**'
      - 'mobile/**'
      - 'localization/**'
      - 'decisions/**'
      - 'data/**'
      - 'packages/shared-core/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/android.yml'

# Builds have no release-write or OIDC permission. The protected publication job
# below requests these permissions only on main.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Assemble release APK (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dev
            html: void-dominion.html
            vn_prefix: alpha
            app_id: com.voiddominion.prototype
            artifact: void-dominion-debug-apk
            release_tag: alpha
            asset: void-dominion-alpha.apk
            release_title: Void Dominion — Alpha (rolling, dev client)
          - profile: player
            html: void-dominion-player.html
            vn_prefix: player
            app_id: com.voiddominion.player
            artifact: void-dominion-player-apk
            release_tag: player
            asset: void-dominion-player.apk
            release_title: Void Dominion — Player (rolling)
    # Matrix values are consumed through env (never inline ${{ }} in run bodies) —
    # keeps run scripts injection-free by construction (zizmor template-injection).
    env:
      PROFILE: ${{ matrix.profile }}
      HTML: ${{ matrix.html }}
      VN_PREFIX: ${{ matrix.vn_prefix }}
      APP_ID: ${{ matrix.app_id }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      ASSET: ${{ matrix.asset }}
      RELEASE_TITLE: ${{ matrix.release_title }}
      # The game server the APK's address field starts on until the player connects
      # elsewhere (mobile/inject-build.mjs → decisions/serverAddress.ts, rule 8): the
      # playtest server. Its ALLOWED_ORIGINS must include the APK origin http://localhost.
      VOID_SERVER: https://77-221-140-87.sslip.io
    steps:
      - name: Assert the release signing keys are unavailable to branch builds
        if: github.ref != 'refs/heads/main'
        env:
          # Pass booleans only: the keys themselves must never enter a build process.
          REPOSITORY_SIGNING_SECRET_PRESENT: ${{ secrets.APK_MANIFEST_SIGNING_KEY != '' }}
          REPOSITORY_KEYSTORE_SECRET_PRESENT: ${{ secrets.APK_RELEASE_KEYSTORE_BASE64 != '' || secrets.APK_RELEASE_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$REPOSITORY_SIGNING_SECRET_PRESENT" != "false" ]; then
            echo "::error::Move APK_MANIFEST_SIGNING_KEY to the main-only android-release environment and delete its repository-level copy."
            exit 1
          fi
          if [ "$REPOSITORY_KEYSTORE_SECRET_PRESENT" != "false" ]; then
            echo "::error::Move APK_RELEASE_KEYSTORE_* to the main-only android-release environment and delete their repository-level copies."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history so the commit count = a monotonic versionCode

      # Build identity baked into BOTH the APK and the release: versionCode = commit count
      # (monotonic, so every rolling build is a strictly newer update), versionName/sha for
      # display. The in-app updater (prototype/src/updater.ts) compares these integers.
      - name: Compute build version
        run: |
          VC=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          {
            echo "VOID_VC=$VC"
            echo "VOID_SHA=$SHA"
            echo "VOID_VN=${VN_PREFIX}-$SHA"
          } >> "$GITHUB_ENV"
          echo "build version: versionCode=$VC versionName=${VN_PREFIX}-$SHA"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          # Capacitor 8 (mobile/ deps) compiles its android library with source
          # release 21 — on JDK 17 `:capacitor-android:compileDebugJavaWithJavac`
          # fails with "invalid source release: 21".
          java-version: '21'

      - name: Build the prototype (self-contained HTML, both profiles)
        run: |
          pnpm install --frozen-lockfile
          pnpm run prototype

      - name: Stage web assets + install Capacitor
        working-directory: mobile
        run: |
          mkdir -p www
          cp "../prototype/dist/${HTML}" www/index.html
          # The solo sim worker the page starts from a file next to it (build.mjs).
          cp ../prototype/dist/sim-worker-*.js www/
          # Bake window.__BUILD__ into the packaged HTML so the APK knows its own version.
          node inject-build.mjs www/index.html "$VOID_VC" "$VOID_SHA" "$VOID_SERVER"
          # The player APK gets its own applicationId so it installs SIDE BY SIDE with
          # the dev alpha (same display name; different app). The dev profile stamps the
          # same appId that is committed (a no-op) — existing alpha installs keep
          # updating in place.
          node -e "
            const fs = require('node:fs');
            const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
            cfg.appId = process.env.APP_ID;
            fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('profile', process.env.PROFILE, '→ appId', cfg.appId);
          "
          # `npm ci` (not `npm install`) installs exactly the committed package-lock.json and
          # fails on drift, so the sideloaded APK is built from the reviewed, locked dep set.
          # Runs the postinstall tar-interop patch the same as install.
          npm ci

      - name: Generate the Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Brand the app (icon + splash) and enable rotation
        working-directory: mobile
        run: |
          npx capacitor-assets generate --android
          node patch-android.mjs
          # Wire the in-app updater (MainActivity VoidNative.open bridge) and stamp
          # versionCode/versionName (VOID_VC / VOID_VN from the env above).
          node patch-updater.mjs

      # Release build type: not debuggable, no signing config, so Gradle leaves the APK
      # unsigned (app-release-unsigned.apk). The key is applied in publish-apk only.
      - name: Assemble release APK (unsigned)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # A debuggable APK is one of the things Play Protect flags, and it lets anyone attach
      # a debugger to the installed game. Fail the build instead of shipping one.
      - name: Assert the APK is a non-debuggable release build
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          if "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -q '^application-debuggable'; then
            echo "::error::The release APK is debuggable. Refusing to ship."
            exit 1
          fi

      - name: Upload APK candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  publish-apk:
    name: Publish signed site APK (${{ matrix.profile }})
    if: github.ref == 'refs/heads/main'
    needs: build-apk
    # Configure this environment with a selected BRANCH rule for main only. The
    # signing key belongs here, with no repository/organization secret fallback.
    environment: android-release
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: dev
            html: void-dominion.html
            vn_prefix: alpha
            app_id: com.voiddominion.prototype
            artifact: void-dominion-debug-apk
            release_tag: alpha
            asset: void-dominion-alpha.apk
            release_title: Void Dominion — Alpha (rolling, dev client)
          - profile: player
            html: void-dominion-player.html
            vn_prefix: player
            app_id: com.voiddominion.player
            artifact: void-dominion-player-apk
            release_tag: player
            asset: void-dominion-player.apk
            release_title: Void Dominion — Player (rolling)
    # Matrix values are consumed through env (never inline ${{ }} in run bodies) —
    # keeps run scripts injection-free by construction (zizmor template-injection).
    env:
      PROFILE: ${{ matrix.profile }}
      HTML: ${{ matrix.html }}
      VN_PREFIX: ${{ matrix.vn_prefix }}
      APP_ID: ${{ matrix.app_id }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      ASSET: ${{ matrix.asset }}
      RELEASE_TITLE: ${{ matrix.release_title }}
      # The game server the APK's address field starts on until the player connects
      # elsewhere (mobile/inject-build.mjs → decisions/serverAddress.ts, rule 8): the
      # playtest server. Its ALLOWED_ORIGINS must include the APK origin http://localhost.
      VOID_SERVER: https://77-221-140-87.sslip.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Build identity baked into BOTH the APK and the release: versionCode = commit count
      # (monotonic, so every rolling build is a strictly newer update), versionName/sha for
      # display. The in-app updater (prototype/src/updater.ts) compares these integers.
      - name: Compute build version
        run: |
          VC=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          {
            echo "VOID_VC=$VC"
            echo "VOID_SHA=$SHA"
            echo "VOID_VN=${VN_PREFIX}-$SHA"
          } >> "$GITHUB_ENV"
          echo "build version: versionCode=$VC versionName=${VN_PREFIX}-$SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download the APK built by this main workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: unsigned

      # The ONE invariant one-tap updates depend on: every build is signed by the SAME
      # release certificate, the one pinned as `signerSha256` in mobile/distribution.json.
      # If it drifted (a rotated or wrong keystore secret), installing an update over the
      # previous build would fail on phones ("conflicts with another package") until
      # players UNINSTALL, so a mismatch stops publication here. The keystore exists on
      # disk only for this step and is removed on exit.
      - name: Sign the APK with the release key and check its certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::APK_RELEASE_KEYSTORE_BASE64 / APK_RELEASE_KEYSTORE_PASSWORD are missing from the android-release environment."
            exit 1
          fi
          KEYSTORE_FILE="$RUNNER_TEMP/apk-release.p12"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          mkdir -p release
          "$ANDROID_HOME/build-tools/$BT/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE_FILE" --ks-key-alias void-release \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out release/app-release.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/aligned.apk"
          APK_CERT=$("$APKSIGNER" verify --print-certs release/app-release.apk \
            | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          PINNED_CERT=$(node -p "require('./mobile/distribution.json').signerSha256")
          echo "apk signer cert : $APK_CERT"
          echo "pinned cert     : $PINNED_CERT"
          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$PINNED_CERT" ]; then
            echo "::error::APK certificate does not match signerSha256 in mobile/distribution.json — updates would break (uninstall required on every phone). Refusing to ship."
            exit 1
          fi
          {
            echo "VOID_SIGNER_CERT_SHA256=$APK_CERT"
            echo "AAPT=$ANDROID_HOME/build-tools/$BT/aapt"
            echo "APKSIGNER=$APKSIGNER"
          } >> "$GITHUB_ENV"

      # The signed manifest is the trust root of the site updater: installed APKs accept
      # only metadata signed by this key and install only bytes with the signed SHA-256.
      # The private key lives ONLY in the protected environment secret (never on the VPS); without it, or with a
      # key that does not pair with mobile/distribution.json, the build stops here.
      - name: Generate the signed site release manifest from the verified APK
        env:
          APK_MANIFEST_SIGNING_KEY: ${{ secrets.APK_MANIFEST_SIGNING_KEY }}
        run: |
          node mobile/apk-manifest.mjs release/app-release.apk version.json

      # SLSA-style build provenance (SEC-7): a keyless cosign signature over the exact
      # APK bytes, tying them to this workflow run + commit (Fulcio cert) with a public
      # Rekor transparency-log entry. Verify with:
      #   cosign verify-blob app-release.apk --signature app-release.apk.sig \
      #     --certificate app-release.apk.cert \
      #     --certificate-identity-regexp 'https://github.com/MoonGameTechnology/MoonGame/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # cosign runs as a pinned container (same pattern as the scanners in
      # security.yml), NOT the `actions/attest-build-provenance` Action — that Action
      # isn't SHA-pinnable from this dev environment (outside GitHub-MCP's repo scope),
      # while ghcr.io's registry API is directly reachable and gives a real, verified
      # digest. Best-effort (continue-on-error): a Sigstore hiccup shouldn't block
      # shipping an APK update to players.
      - name: Sign APK build provenance with cosign (SEC-7, keyless)
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          APK=release/app-release.apk
          docker run --rm \
            -e COSIGN_EXPERIMENTAL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -v "$PWD:/work" -w /work \
            ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31 \
            sign-blob --yes "$APK" \
            --output-signature "$APK.sig" \
            --output-certificate "$APK.cert"

      - name: Upload signed release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}-release
          path: |
            release/app-release.apk
            release/app-release.apk.sig
            release/app-release.apk.cert
            version.json
          if-no-files-found: error

      # A stable, shareable download link per lane: keep one rolling prerelease per tag
      # ("alpha" = dev client, "player" = player client) whose asset URL never changes,
      # refreshed on every main build. Only from main — branch builds still produce the
      # artifact above, just no release.
      - name: Publish to the rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/app-release.apk "$ASSET"
          # Provenance sig/cert are best-effort (SEC-7 cosign step above) — attach
          # them to the release when present, skip quietly when the sign step failed.
          RELEASE_ASSETS=("$ASSET" "version.json")
          if [ -f release/app-release.apk.sig ]; then
            cp release/app-release.apk.sig "$ASSET.sig"
            cp release/app-release.apk.cert "$ASSET.cert"
            RELEASE_ASSETS+=("$ASSET.sig" "$ASSET.cert")
          fi
          {
            if [ "$PROFILE" = "player" ]; then
              echo "Rolling player build — the latest PLAYER-client APK built from main (${VOID_SHA})."
            else
              echo "Rolling alpha — the latest dev-client APK built from main (${VOID_SHA})."
            fi
            echo
            # Machine-readable marker the in-app updater parses (prototype/src/updater.ts):
            # it compares this versionCode against the installed build's baked one.
            echo "<!-- void:versionCode=${VOID_VC} void:sha=${VOID_SHA} -->"
            echo "Build: ${VOID_VN} · versionCode ${VOID_VC}."
            echo
            echo "Install on Android:"
            echo "1. Download ${ASSET} below."
            echo "2. Open it; allow \"install from unknown sources\" if prompted."
            if [ "$PROFILE" = "player" ]; then
              echo "3. Launch → the server field already points at ${VOID_SERVER} → pick a running match."
              echo "   This is the PLAYER client: no single-player, no dev tools; the tutorial works offline."
            else
              echo "3. Launch — single-player works fully offline. Rotates freely (phone / tablet)."
            fi
            echo "New APKs check https://77-221-140-87.sslip.io/downloads/android/$RELEASE_TAG/latest.json; legacy APKs use this release for the migration update."
            echo
            echo "Release-signed sideload build (not from a store). For multiplayer, point the"
            echo "connect screen at a host running pnpm dev:proto-server (see docs/multiplayer.md)."
            if [ -f "$ASSET.sig" ] && [ -f "$ASSET.cert" ]; then
              echo
              echo "Build provenance (SEC-7): verify these exact bytes came from this repo's CI —"
              echo "  cosign verify-blob $ASSET --signature $ASSET.sig --certificate $ASSET.cert \\"
              echo "    --certificate-identity-regexp 'https://github.com/MoonGameTechnology/MoonGame/.*' \\"
              echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            fi
          } > release-notes.md
          # Refuse publication from a rerun of an older commit; same-code rebuilds
          # must preserve their APK bytes. The host publisher enforces this too.
          # Both rolling tags already exist. Any lookup failure must stop this
          # publication before deleting a release (including auth/network errors).
          PREVIOUS=$(gh release view "$RELEASE_TAG" --json body --jq .body)
          export PREVIOUS
          node --input-type=module - <<'JS'
          const previous = /void:versionCode=(\d+)/.exec(process.env.PREVIOUS || '');
          if (previous && Number(previous[1]) >= Number(process.env.VOID_VC)) {
            console.error('Refusing a non-increasing Android versionCode; build a newer main commit.');
            process.exit(1);
          }
          JS
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          gh release create "$RELEASE_TAG" "${RELEASE_ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$RELEASE_TITLE" \
            --notes-file release-notes.md
