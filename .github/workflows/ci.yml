name: CI

# Full gate for PRs, merge groups and branches without a PR: lint + typecheck +
# test + audit. Redundant push copies only run the small selection job below.
# A Postgres service is attached and DATABASE_URL is set, so the durable-path adapter
# tests (store.test.ts, gated behind DATABASE_URL) actually run in CI instead of being
# skipped — the production persistence path is exercised, not just the in-memory one.
# Actions are SHA-pinned (SD-6.1 / F-16) with a trailing `# vN` for readability, and
# checkout sets `persist-credentials: false` (the job only reads) — same hardening as
# security.yml, self-flagged by its zizmor job.

# Keep triggers unchanged: filtering queue push events previously stopped checks
# (AUD-9). A small read-only job skips duplicate WORK, not event delivery.
# PR/merge_group remain canonical; a branch without an open PR still gets feedback.
on:
  workflow_dispatch:
  push:
    branches: ['**', '!main']
  pull_request:
  merge_group:

concurrency:
  # Events must not cancel one another. Repeated queue attempts also keep running.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  run-policy:
    name: Select CI execution
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.policy.outputs.result }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: policy
        with:
          script: |
            const { runPolicy } = await import(process.env.GITHUB_WORKSPACE + '/.github/scripts/ci-run-policy.mjs');
            return await runPolicy({ github, context, core });

  check:
    needs: run-policy
    if: ${{ !cancelled() && (github.event_name != 'push' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/') || needs.run-policy.outputs.run != 'false') }}
    name: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && 'Branch — ' || '' }}lint · typecheck · test · audit
    runs-on: ubuntu-24.04

    services:
      postgres:
        # По дайджесту, как все остальные образы (docs/security/image-pinning.md). Сервис
        # поднимается в той же джобе, где лежит выкачанный репозиторий, так что подменённый
        # `postgres:16` — это чужой код рядом с нашим деревом, а не «просто база для тестов».
        # Обновляется вместе со сканерами (скилл refresh-scanner-digests).
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: void_test
        ports:
          - 5432:5432
        # Wait until the DB accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # store.test.ts runs its Postgres adapter contracts only when this is set; every
      # other test either uses in-memory stores or passes an explicit empty env.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test

    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      # The backup drills restore into PostgreSQL 16. A newer pg_dump emits SET
      # parameters the server cannot parse, so select the matching client explicitly.
      - name: PostgreSQL 16 client tools for backup drills
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          printf '%s\n' '/usr/lib/postgresql/16/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
          /usr/lib/postgresql/16/bin/psql --version

      - run: pnpm install --frozen-lockfile

      - name: Gate (lint + typecheck + test, incl. Postgres adapters)
        run: pnpm run check

      - name: Security alert rules and missing-data scenarios
        run: node deploy/security/check-alerts.mjs

      # SCA over the same lockfiles the security workflow scans. `pnpm audit` is
      # retired here: npm shut down both audit endpoints (HTTP 410, 2026-07) and
      # pnpm has no bulk-advisory client yet — OSV-Scanner queries osv.dev (which
      # mirrors GHSA) instead. Exits non-zero on findings AND on scanner failure
      # (fail-secure: a scanner that couldn't run can't certify).
      - name: Dependency audit (OSV-Scanner)
        run: |
          # Дайджест, а не тег: этот шаг БЛОКИРУЮЩИЙ, то есть чужой образ решает, войдёт
          # код в main или нет — подменённый `:v1.9.1` тихо начал бы отвечать «чисто».
          # Пин тот же, что у джобы `osv` в security.yml:357 — бампить их ВМЕСТЕ
          # (скилл refresh-scanner-digests).
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner@sha256:36dea1baa2b34df3ee911d712e6a774eff04cc8b25789e0e6837d40759afaeab \
            --lockfile=pnpm-lock.yaml --lockfile=mobile/package-lock.json

      # M2 perf report (metrics-roadmap): CPU frame cost of the prototype's render
      # loop (idle/pan/zoom) against the p95 budget. Non-blocking by design — the
      # report shows up in the job log for review; flip to PERF_STRICT=1 to gate.
      - name: Perf report (non-blocking)
        run: pnpm run perf
        continue-on-error: true

      # Lint and tsc cover prototype/. The real browser additionally verifies the
      # built bundle, DOM, console and rejected promises. Both setup and test failures
      # block this required CI job; an unavailable browser is not a passing check.
      - name: Browser smoke
        id: browser
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::error title=Browser smoke::смоук не смог установиться (Chromium недоступен) — бандл НЕ проверялся"
            exit 1
          fi
          if ! pnpm run smoke:browser; then
            echo "::error title=Browser smoke::смоук нашёл ошибку в собранном бандле — смотри лог шага"
            exit 1
          fi

      - name: Site APK update and desktop download smoke
        run: |
          pnpm run smoke:browser:install
          pnpm run prototype
          pnpm run smoke:apk-site

      - name: Hub navigation smoke
        run: node prototype/hubnavigationtest.mjs

      - name: Army transfer window smoke
        run: node prototype/troopselectiontest.mjs

      - name: Corporation identity smoke
        run: node prototype/corptest.mjs --identity-only

      # The rest of the corporation flows: the base, corporation battles, the style and
      # backdrop shop, building materials and the news window. All must pass. Continue
      # through the loop to collect every failure, then fail the required CI job.
      # Each DB smoke makes/drops its own *_test database next to the service one.
      - name: Corporation flows smoke
        id: corporation
        env:
          HARNESS_OUT: .playwright-mcp/corporation
          AVA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test
          CORP_STYLE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test
          CORP_MATERIALS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test
        run: |
          failed=0
          for smoke in corptest avatest corpstyletest corpmaterialstest newstest; do
            if ! node "prototype/$smoke.mjs"; then
              echo "::error title=Corporation flows smoke::$smoke упал — смотри лог шага"
              failed=1
            fi
          done
          exit "$failed"

      - name: Browser and corporation failure diagnostics
        if: failure() && (steps.browser.outcome == 'failure' || steps.corporation.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-corporation-failure
          path: .playwright-mcp/
          include-hidden-files: true
          retention-days: 7

      # YAG-1.1c: робот играет в СОБРАННЫЙ архив площадки (`prototype/dist/yandex/`) —
      # запуск, забег, «Продолжить», ролик за награду, закрытые двери по ссылке. Архив
      # собран с `__SECTOR_ZERO_ONLY__`, и его кода не повторяет ни одна другая сборка:
      # смоук выше открывает `void-dominion.html`. Поза та же — не блокирует, а сбой
      # всплывает аннотацией; `--install` идемпотентен и лишь подтверждает Chromium.
      - name: Player foreground activity smoke
        run: |
          pnpm run smoke:browser:install
          pnpm run prototype
          pnpm run smoke:player-activity

      # The tutorial follows live controls; unit tests cannot catch a moved catalogue
      # or a hidden phone button. Use the Chromium and bundle prepared above.
      - name: Guided onboarding smoke
        id: onboarding
        run: node prototype/onboardingtest.mjs

      - name: Onboarding failure screenshots
        if: failure() && steps.onboarding.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guided-onboarding-failure
          path: /tmp/gw-onboarding
          retention-days: 7

      - name: Sector Zero guided training smoke
        id: training
        run: node prototype/trainingtest.mjs

      - name: Training failure screenshots
        if: failure() && steps.training.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sector-zero-training-failure
          path: /tmp/sz-training
          retention-days: 7

      - name: Platform archive smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Platform archive smoke::смоук не смог установиться (Chromium недоступен) — архив НЕ проверялся"
            exit 1
          fi
          if ! pnpm run smoke:yandex; then
            echo "::error title=Platform archive smoke::робот нашёл ошибку в архиве площадки — смотри лог шага"
            exit 1
          fi
        continue-on-error: true

      # SZ-ci-robot: главный робот продукта. Робот архива выше проверяет обвязку площадки,
      # а этот — сам Sector Zero: меню и маршрут глав, подготовку, забег, итоги, комиксы,
      # снабжение, аналитику. Он собирает `main.ts` сам и кладёт бандл в готовую страницу
      # `sector-zero-dev.html` — сборку берёт из шагов выше (`smoke:yandex` собирает всегда),
      # а без неё собирает сам. Раньше его гоняли только руками, и между BOOT-1 и BOOT-1.1
      # он падал незамеченным. Поза та же — не блокирует, сбой всплывает аннотацией.
      - name: Sector Zero smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Sector Zero smoke::смоук не смог установиться (Chromium недоступен) — забег НЕ проверялся"
            exit 1
          fi
          if [ ! -f prototype/dist/sector-zero-dev.html ] && ! pnpm run prototype; then
            echo "::error title=Sector Zero smoke::сборка прототипа упала — смотри лог шага"
            exit 1
          fi
          if ! pnpm run smoke:sector-zero; then
            echo "::error title=Sector Zero smoke::робот нашёл ошибку в забеге Sector Zero — смотри лог шага"
            exit 1
          fi
        continue-on-error: true

      # REFM-204: сетевая партия — вход позывным, приказ, обрыв с дозвоном, выход ‹ в хаб.
      # Страховка распила `main.ts`: сетевую проводку (сокет, дозвон, выход) не видит ни
      # один другой робот. Собирает прототип сам и поднимает прото-сервер на свободном
      # порту; `DATABASE_URL` этой джобы он серверу не передаёт — мир каждый раз новый.
      # Поза та же — не блокирует, сбой всплывает аннотацией.
      - name: Network match smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Network match smoke::смоук не смог установиться (Chromium недоступен) — сетевая партия НЕ проверялась"
            exit 1
          fi
          if ! pnpm run smoke:net; then
            echo "::error title=Network match smoke::робот нашёл ошибку в сетевой партии — смотри лог шага"
            exit 1
          fi
        continue-on-error: true

      # Отступление и перелёт шаттлов: оба робота кладут игру с крючками в готовую страницу
      # `void-dominion.html`. Её собирают смоуки выше, а если сборки нет — шаг собирает сам.
      # Раньше их гоняли только руками: ручное «Отступить» на ПК было сломано, `smoke:retreat`
      # это видел, но запустил его только плейтест 2026-10-09 (PT-01). Поза та же — не
      # блокирует, сбой всплывает аннотацией.
      - name: Retreat smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Retreat smoke::смоук не смог установиться (Chromium недоступен) — отступление НЕ проверялось"
            exit 1
          fi
          if [ ! -f prototype/dist/void-dominion.html ] && ! pnpm run prototype; then
            echo "::error title=Retreat smoke::сборка прототипа упала — смотри лог шага"
            exit 1
          fi
          if ! pnpm run smoke:retreat; then
            echo "::error title=Retreat smoke::робот нашёл ошибку в отступлении — смотри лог шага"
            exit 1
          fi
        continue-on-error: true

      - name: Relocate smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Relocate smoke::смоук не смог установиться (Chromium недоступен) — перелёт шаттлов НЕ проверялся"
            exit 1
          fi
          if [ ! -f prototype/dist/void-dominion.html ] && ! pnpm run prototype; then
            echo "::error title=Relocate smoke::сборка прототипа упала — смотри лог шага"
            exit 1
          fi
          if ! pnpm run smoke:relocate; then
            echo "::error title=Relocate smoke::робот нашёл ошибку в перелёте шаттлов — смотри лог шага"
            exit 1
          fi
        continue-on-error: true

      # Эскадра в воздухе (SHU-6.14): выбор тапом по значку, делёж, новая точка патруля и
      # цель удара, «Вернуть». Поза та же, что у перелёта: не блокирует, сбой — аннотацией.
      - name: Aloft smoke (non-blocking)
        run: |
          if ! pnpm run smoke:browser:install; then
            echo "::warning title=Aloft smoke::смоук не смог установиться (Chromium недоступен) — эскадра в воздухе НЕ проверялась"
            exit 1
          fi
          if [ ! -f prototype/dist/void-dominion.html ] && ! pnpm run prototype; then
            echo "::error title=Aloft smoke::сборка прототипа упала — смотри лог шага"
            exit 1
          fi
          if ! pnpm run smoke:aloft; then
            echo "::error title=Aloft smoke::робот нашёл ошибку у эскадры в воздухе — смотри лог шага"
            exit 1
          fi
        continue-on-error: true
