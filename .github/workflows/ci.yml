name: CI

# The gate for every push to main and every PR: lint + typecheck + test + audit.
# A Postgres service is attached and DATABASE_URL is set, so the durable-path adapter
# tests (store.test.ts, gated behind DATABASE_URL) actually run in CI instead of being
# skipped — the production persistence path is exercised, not just the in-memory one.
# Actions are SHA-pinned (SD-6.1 / F-16) with a trailing `# vN` for readability, and
# checkout sets `persist-credentials: false` (the job only reads) — same hardening as
# security.yml, self-flagged by its zizmor job.

# ТРИГГЕРЫ. Раньше гейт бежал только на `main` и на pull_request — то есть пуш в фиче-ветку
# не проверялся ВООБЩЕ, и обратная связь появлялась лишь в момент открытия PR. Локально
# правило «перед коммитом гоняй pnpm run check» машиной не принуждается (git-хуков в репо
# нет), так что до открытия PR красный код мог жить в ветке сколько угодно. Теперь гейт
# бежит на push в любую ветку. Цена этого решения — на ветке с открытым PR гейт бежит
# ДВАЖДЫ (от push и от pull_request); `concurrency` ниже дубль не гасит, и почему гасить
# его нельзя — расписано там же.
on:
  workflow_dispatch:
  # ВНИМАНИЕ: здесь стояло `branches-ignore: ['gh-readonly-queue/**']` (AUD-9) — и после
  # того, как эта правка доехала до `main`, очередь встала НАСМЕРТЬ: на всех ветках
  # очереди, собранных поверх такого `main`, не запускалось НИ ОДНОГО прогона (`merge_group`
  # в том числе), required-чеки не отчитывались никогда, и записи выбрасывало по таймауту.
  # Корреляция точная: pr-497 и pr-500 на прежнем `main` — прогоны были; pr-507…pr-510 на
  # новом — ноль. Похоже, GitHub решает, слать ли событие, по конфигу с БАЗОВОЙ ветки, а не
  # с ветки очереди. Механизм до конца не доказан, но цена ошибки несимметрична: столкновение
  # прогонов стоит редкого ложного выброса, а нерассылка событий — полной остановки мержа.
  # Возвращаем заведомо рабочую форму, а задачу AUD-9 решаем ключом `concurrency` ниже.
  push:
    branches: ['**']
  pull_request:
  # Merge queue: the queue builds a temporary "latest main + this PR" branch and waits
  # for the REQUIRED checks on it — but a workflow only runs there if it subscribes to
  # `merge_group`. Without this line the queue never sees `lint · typecheck · test ·
  # audit` report and every PR sits until it times out. Harmless while no queue is
  # configured (the event simply never fires), so it can land ahead of the setting.
  merge_group:

concurrency:
  # Про push+pull_request: ключ их НЕ схлопывает, и это осознанно — полный разбор в
  # шапке `concurrency` в security.yml (там же, почему `github.ref_name` брать нельзя).
  # Здесь ключ гасит только последовательные пуши в одну ветку.
  # `github.event_name` в ключе — это и есть починка AUD-9, но без правки триггеров.
  # Ветку очереди создаёт merge-queue, и на неё прилетают ОБА события — `merge_group` и
  # `push`. Без префикса по событию ключ у них совпадал (`github.head_ref` на обоих пуст,
  # остаётся `github.ref` = имя ветки очереди), а у push-прогона `cancel-in-progress`
  # истинно — он убивал merge_group-прогон через секунду после старта, очередь читала
  # отменённый required-чек как провал и выбрасывала PR с `CI_FAILURE` при зелёном коде.
  # Guard ниже от этого не спасал: он разводит merge_group-прогоны между собой, а убивал
  # их push. С префиксом группы разные — погасить друг друга они больше не могут.
  # Последовательные пуши в одну ветку по-прежнему схлопываются: у них и событие одно.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  # На `merge_group` отменять НЕЛЬЗЯ. Ключ группы там складывается из имени ветки очереди
  # (`gh-readonly-queue/main/pr-N-<база>`), а оно одинаково у всех попыток поставить тот же
  # PR на ту же базу. Повторная постановка гасила бы ещё идущий прогон прошлой записи,
  # очередь читала бы отменённый required-чек как провал и выбрасывала PR с `CI_FAILURE`
  # при полностью зелёном коде. Прогон очереди решает, влить или нет, — его результат
  # нельзя терять; лишний доигравший прогон дешевле ложного выброса.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · audit
    runs-on: ubuntu-latest

    services:
      postgres:
        # По дайджесту, как все остальные образы (docs/security/image-pinning.md). Сервис
        # поднимается в той же джобе, где лежит выкачанный репозиторий, так что подменённый
        # `postgres:16` — это чужой код рядом с нашим деревом, а не «просто база для тестов».
        # Обновляется вместе со сканерами (скилл refresh-scanner-digests).
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: void_test
        ports:
          - 5432:5432
        # Wait until the DB accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # store.test.ts runs its Postgres adapter contracts only when this is set; every
      # other test either uses in-memory stores or passes an explicit empty env.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Gate (lint + typecheck + test, incl. Postgres adapters)
        run: pnpm run check

      # SCA over the same lockfiles the security workflow scans. `pnpm audit` is
      # retired here: npm shut down both audit endpoints (HTTP 410, 2026-07) and
      # pnpm has no bulk-advisory client yet — OSV-Scanner queries osv.dev (which
      # mirrors GHSA) instead. Exits non-zero on findings AND on scanner failure
      # (fail-secure: a scanner that couldn't run can't certify).
      - name: Dependency audit (OSV-Scanner)
        run: |
          # Дайджест, а не тег: этот шаг БЛОКИРУЮЩИЙ, то есть чужой образ решает, войдёт
          # код в main или нет — подменённый `:v1.9.1` тихо начал бы отвечать «чисто».
          # Пин тот же, что у джобы `osv` в security.yml:357 — бампить их ВМЕСТЕ
          # (скилл refresh-scanner-digests).
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner@sha256:36dea1baa2b34df3ee911d712e6a774eff04cc8b25789e0e6837d40759afaeab \
            --lockfile=pnpm-lock.yaml --lockfile=mobile/package-lock.json

      # M2 perf report (metrics-roadmap): CPU frame cost of the prototype's render
      # loop (idle/pan/zoom) against the p95 budget. Non-blocking by design — the
      # report shows up in the job log for review; flip to PERF_STRICT=1 to gate.
      - name: Perf report (non-blocking)
        run: pnpm run perf
        continue-on-error: true

      # Boots the BUILT prototype in a real headless browser and fails on any console
      # error. `pnpm run check` cannot see this class of defect: prototype/ is outside
      # ESLint and tsc, and uitest/perf drive a fake DOM — esbuild-only bugs, unhandled
      # rejections and browser warnings show up nowhere else. Non-blocking for now (same
      # posture as perf): the runner has to fetch a Chromium, so let it prove itself in
      # the log before it can redden main.
      - name: Browser smoke (non-blocking)
        run: |
          pnpm run smoke:browser:install
          pnpm run smoke:browser
        continue-on-error: true
