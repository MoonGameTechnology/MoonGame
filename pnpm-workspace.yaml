packages:
  - 'packages/*'

# Карантин для свежеопубликованных версий (supply-chain, OWASP A08). Пакет моложе
# указанного возраста НЕ будет разрешён при установке — тот самый приём, который pnpm 11
# сделал поведением по умолчанию после кампаний Shai-Hulud (самореплицирующийся червь в
# npm: сотни пакетов, ~132 млн загрузок в месяц). Смысл простой: такие компрометации
# почти всегда ловят в первые часы, и достаточно не быть тем, кто ставит пакет именно в
# эти часы.
#
# ПОЧЕМУ 1440 (сутки), а не 10080 (неделя, как cooldown у Dependabot) — это разные слои:
#   - cooldown в .github/dependabot.yml придерживает ПЛАНОВЫЕ обновления на 7 дней;
#   - здесь пол для ЛЮБОГО разрешения версии, включая срочный секьюрити-патч, который как
#     раз хочется поставить немедленно. Недельный пол превратил бы починку уязвимости в
#     неделю ожидания, поэтому берём сутки — значение, выбранное дефолтом в pnpm 11.
# Точечный обход, когда он реально нужен: minimumReleaseAgeExclude (пакеты/версии).
#
# НА CI НЕ ВЛИЯЕТ: там `pnpm install --frozen-lockfile`, то есть установка ровно по
# lockfile без переразрешения. Настройка срабатывает при `pnpm add` / `pnpm update` —
# там, где версия действительно выбирается.
#
# Требует pnpm >= 10.16 (в package.json закреплён 10.33), мажорное обновление не нужно.
minimumReleaseAge: 1440
