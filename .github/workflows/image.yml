name: Release image (GHCR + cosign)

# SEC-13 — the missing link between "we scan containers" and "we run containers".
#
# THE GAP THIS CLOSES. Until now nothing published an image: Render rebuilt the
# Dockerfile on its own infra and the VPS ran `docker compose up --build` on the box.
# Both are INDEPENDENT rebuilds of the same Dockerfile, so the artifact `trivy-image`
# scanned in CI was never the artifact that ran in production — there was no way to
# state "what is running was scanned", and no identity (digest) to even ask about.
#
# THE CHAIN. build → blocking gate → push to GHCR → keyless cosign signature over the
# resulting DIGEST. A failed gate means no push, so an unchecked image cannot reach the
# registry the deploy pulls from. The deploy side verifies the signature before starting
# anything: deploy/verify-image.sh + deploy/docker-compose.release.yml (runbook in
# deploy/README.md).
#
# ДВА ОБРАЗА, ДВЕ ДЖОБЫ (SEC-35). `publish` выпускает образ сервера, `publish-caddy` —
# наш собственный Caddy (`deploy/caddy/Dockerfile`, SEC-31), который до сих пор собирался
# на хосте и потому был единственным куском прода без идентичности и подписи. Джобы
# независимы (свой пакет GHCR, своя история дайджестов) и подписываются ОДНИМ этим
# воркфлоу — поэтому `deploy/verify-image.sh` проверяет оба одной и той же командой.
# Гейты у них РАЗНЫЕ, и это разобрано у самих джоб: у сервера — `trivy --ignore-unfixed
# --exit-code 1`, у Caddy — приёмка пересборки + смоук, потому что в его бинаре остаются
# уже разобранные и принятые находки с опубликованным фиксом.
#
# WHY A DIGEST, NOT A TAG. Tags are mutable; a signature over a tag proves nothing about
# the bytes that get pulled later. Everything downstream — signing, verification, the
# compose overlay — speaks `ghcr.io/<repo>@sha256:…`.
#
# WHY COSIGN-AS-A-PINNED-CONTAINER (not actions/attest-build-provenance): the SEC-7
# reasoning applies unchanged — that Action can't be SHA-pinned from this dev
# environment, while ghcr.io's registry API gives a real, verified digest. Same image
# pin as android.yml.
#
# ONE-TIME REPO SETTING. The push needs a GITHUB_TOKEN that may write packages. If
# Settings → Actions → General → Workflow permissions is on "Read repository contents
# and packages permissions", the `packages: write` request below is capped by that
# setting and the push fails with 403 — the workflow can only narrow the default, never
# exceed it. Flip that setting to read/write (or grant the package `write` to this repo
# under the package's own settings once it exists). The first package a workflow pushes
# inherits the repository's visibility.
#
# ПЕРВЫЙ ПРОГОН SEC-35 СОЗДАЁТ ВТОРОЙ ПАКЕТ — `<repo>/caddy`. Проверьте его видимость
# сразу: `deploy/verify-image.sh` намеренно ходит в реестр БЕЗ учётных данных (пакет
# сервера публичный), и приватный пакет фронта уронил бы проверку подписи на деплое. Если
# он окажется приватным — либо откройте его, либо передавайте креды флагами, как описано
# в шапке самого скрипта.
#
# Actions are SHA-pinned (SD-6.1 / F-16); checkouts don't persist credentials.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    name: build → scan → push → sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image + signature to ghcr.io
      id-token: write # keyless cosign: GitHub OIDC → Fulcio → Rekor
      attestations: write # SLSA build provenance (см. шаг attest ниже)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR namespaces are lowercase; `MoonGameTechnology/MoonGame` is not.
      - name: resolve image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: docker build -t "$IMAGE:ci" .

      # BLOCKING gate before the image can exist in the registry. Mirrors the
      # `trivy-image` job in security.yml (same pinned scanner, same .trivyignore
      # mounted from the repo root) — this one just runs earlier in the same job so a
      # finding stops the push instead of reporting on an image already published.
      - name: scan before push (blocking)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          # Пин по дайджесту (= 0.58.2), тот же, что у trivy-fs/trivy-image/trivy-deps в
          # security.yml — бампить их надо вместе. Тег mutable, а этот скан решает, уедет
          # ли образ в GHCR.
          #
          # --ignore-unfixed (SEC-27) — то же правило, что у джобы `trivy-image` в
          # security.yml, и по той же причине: находка без опубликованного фикса не
          # чинится ничем, а здесь она запрещала бы ВЫПУСК образа вовсе — то есть держала
          # бы прод на старой сборке из-за уязвимости, которой в новой ровно столько же.
          # Полный список (включая нефиксируемое) считает и грузит в Code Scanning
          # security.yml на том же Dockerfile; здесь решается только «пускать ли в GHCR».
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            image --ignore-unfixed --exit-code 1 --format table "$IMAGE:ci"

      # ВТОРОЙ блокирующий гейт перед пушем, к сканеру ортогональный. Trivy отвечает на
      # «что внутри», смоук — на «работает ли оно вообще»: сканер читает файловую
      # систему и образ не запускает, поэтому образ, падающий на старте, проходит скан
      # чисто и уезжает в GHCR подписанным. Подпись такого образа хуже, чем отсутствие
      # подписи: она удостоверяет нерабочий артефакт. Живой случай — в шапке скрипта.
      - name: smoke before push (blocking)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: .github/scripts/smoke-image.sh "$IMAGE:ci"

      - name: push
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          short="${SHA:0:12}"
          docker tag "$IMAGE:ci" "$IMAGE:main"
          docker tag "$IMAGE:ci" "$IMAGE:sha-$short"
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$short"
          # The digest is assigned by the registry on push — read it back rather than
          # computing it locally, so what we sign is exactly what a `docker pull` gets.
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:main" |
            grep "^$IMAGE@" | head -1)
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the pushed digest — refusing to sign a tag"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pushed $ref"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      # SLSA build provenance — ДОПОЛНЕНИЕ к подписи, а не замена. Подпись cosign
      # отвечает на вопрос «кто это подписал»; provenance отвечает на «чем и из чего это
      # собрано»: какой воркфлоу, какой коммит, какой раннер, какие входы. Именно это
      # закрывает класс атак SolarWinds-типа, где исходник чист, а подменён сам билд.
      # Проверяется без cosign, штатным `gh attestation verify <ref> --repo <owner/repo>`.
      #
      # SEC-7 когда-то отказался от этого экшена, потому что его нельзя было закрепить по
      # SHA: `api.github.com` из dev-среды недоступен, а пин по тегу поймал бы zizmor. Но
      # SHA прекрасно снимается `git ls-remote` — тем же способом, каким пинится
      # actions/cache. Ограничение снято, причина отказа больше не действует.
      #
      # ПИН — SHA КОММИТА, а не тег-объекта. У этого репозитория `v3.2.0` — АННОТИРОВАННЫЙ
      # тег, то есть `git ls-remote` печатает две строки: `refs/tags/v3.2.0` = 62fc1d59…
      # (сам тег-объект) и `refs/tags/v3.2.0^{}` = 96278af6… (коммит). Раньше здесь стоял
      # первый, и zizmor справедливо ругался `ref-version-mismatch`: «points to commit
      # 96278af6caaf». У остальных наших экшенов теги легковесные, там SHA тега и коммита
      # совпадают, поэтому подвох виден только на аннотированном. Оба SHA неизменяемы, так
      # что дырой это не было — но пин по коммиту это конвенция, которую понимают
      # инструменты (zizmor, dependabot), а непонятый пин никто не перепроверит.
      - name: attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Keyless: the Fulcio cert binds the signature to THIS workflow file + repo +
      # commit, and the Rekor entry makes it publicly auditable. No key to manage or
      # leak. Blocking on purpose (unlike the best-effort APK signature in android.yml):
      # an unsigned image would fail deploy/verify-image.sh anyway, so a silent failure
      # here would just surface later as an undeployable image.
      #
      # REGISTRY CREDENTIALS GO IN AS FLAGS, NOT AS A MOUNTED DOCKER CONFIG. The first
      # live run (run #1 on the merge commit) got all the way through Fulcio, the SCT and
      # the Rekor entry, then died pushing the signature: `UNAUTHORIZED: unauthenticated`.
      # The `docker push` above had just succeeded with the same token, so the token was
      # never the problem — cosign simply never saw it. The mounted `~/.docker/config.json`
      # is unusable to it: the cosign image is distroless and does NOT run as root, so
      # neither `/root/…` nor a 0600 file owned by the runner is reachable, and cosign
      # fell back to an anonymous token. Passing the credentials explicitly removes the
      # whole question of which user and which HOME the container happens to have.
      - name: sign the digest (cosign, keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
          REF: ${{ steps.push.outputs.ref }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e COSIGN_EXPERIMENTAL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e REGISTRY_USER \
            -e REGISTRY_TOKEN \
            ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31 \
            sign --yes \
            --registry-username "$REGISTRY_USER" \
            --registry-password "$REGISTRY_TOKEN" \
            "$REF"

      # Prove the published signature is actually verifiable the way a deploy verifies
      # it — same command, same identity constraints as deploy/verify-image.sh. A green
      # publish that nobody can verify is worse than no signature at all.
      - name: verify what we just signed
        env:
          REF: ${{ steps.push.outputs.ref }}
          REPO: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e REGISTRY_USER \
            -e REGISTRY_TOKEN \
            ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31 \
            verify "$REF" \
            --registry-username "$REGISTRY_USER" \
            --registry-password "$REGISTRY_TOKEN" \
            --certificate-identity-regexp "^https://github.com/$REPO/\.github/workflows/image\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            -o text

      - name: deploy instructions
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "## 📦 Signed image published"
            echo ""
            echo '```bash'
            echo "./deploy/verify-image.sh $REF   # cosign verify — run this FIRST"
            echo "docker pull $REF"
            echo "cd deploy && VOID_IMAGE=$REF \\"
            echo "  docker compose -f docker-compose.yml -f docker-compose.release.yml up -d --no-build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-caddy:
    name: 'Caddy: build → приёмка → smoke → push → sign'
    # SEC-35 — вторая половина того же утверждения. Джоба `publish` выше сделала
    # проверяемым «что бежит в проде — то и просканировано» для образа СЕРВЕРА. У Caddy
    # этого не было: SEC-31 перевёл его на собственную сборку, но собиралась она НА ХОСТЕ
    # (`build:` в `deploy/docker-compose.tls.yml`), то есть у байтов, которые терминируют
    # TLS из интернета, не было ни идентичности, ни подписи — только утверждение об
    # исходниках. Теперь цепочка та же: собрали → проверили → запушили → подписали
    # дайджест, а `deploy/verify-image.sh` проверяет подпись перед стартом.
    #
    # ЧЕМ ГЕЙТ ОТЛИЧАЕТСЯ ОТ СЕРВЕРНОГО, И ПОЧЕМУ ЭТО НЕ ОСЛАБЛЕНИЕ. У `publish` гейт —
    # `trivy --ignore-unfixed --exit-code 1`: «есть опубликованный фикс, который мы не
    # поставили — не выпускаем». Здесь такой гейт был бы красным в первый же день, и
    # починить его было бы нечем, кроме запрещённого: в бинаре остаются находки С фиксом
    # (`CVE-2026-56854` CRITICAL в x/crypto, три HIGH в grpc), а закрываются они только
    # бампом модулей ПОВЕРХ `go.mod` caddy — ровно то, от чего SEC-31 отказался, чтобы в
    # TLS-терминаторе не появилось непроверенных апстримом комбинаций. Все они разобраны
    # поимённо по символам в бинаре и признаны недостижимыми (запись SEC-32 в
    # `docs/security/pipeline.md`); гейт, запрещающий выпуск из-за уже разобранного и
    # принятого, не защищает, а держит прод на старой сборке. То же и с пакетами базы
    # (curl, openssl, c-ares): их лечит `apk upgrade`, и это отдельное решение владельца.
    #
    # Поэтому блокируют здесь ДВА других шага, и оба про этот образ по существу:
    #   ПРИЁМКА — пересборка всё ещё закрывает те 14 находок, ради которых она затевалась
    #             (тот же скрипт, что и в `security.yml`: одна копия списка на репозиторий);
    #   СМОУК   — собранный образ стартует, HEALTHCHECK доходит до healthy и :80 отвечает.
    # Смоук здесь не формальность: мы подменяем в образе бинарь, а Trivy читает файловую
    # систему и ничего не запускает — подпись нерабочего артефакта хуже отсутствия подписи.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image + signature to ghcr.io
      id-token: write # keyless cosign: GitHub OIDC → Fulcio → Rekor
      attestations: write # SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GHCR namespaces are lowercase; `MoonGameTechnology/MoonGame` is not. Caddy живёт
      # ОТДЕЛЬНЫМ пакетом под тем же неймспейсом — у него своя история дайджестов и свой
      # цикл пересборки, мешать его с образом сервера в одном пакете нельзя.
      - name: resolve image name
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/caddy" >> "$GITHUB_OUTPUT"

      - name: build
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: docker build -t "$IMAGE:ci" -f deploy/caddy/Dockerfile deploy/caddy

      - name: scan
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          # Тот же пиненный сканер (= 0.58.2), что у trivy-fs/trivy-image/trivy-deps/
          # trivy-caddy в security.yml — бампить их надо вместе.
          #
          # `--ignorefile /dev/null` — НЕ формальность. Рабочий каталог здесь репозиторий
          # (в него пишется отчёт), а Trivy молча подхватывает `./.trivyignore` из cwd —
          # ловушка из записи SEC-32. Корневой файл заведён под НАШ distroless-образ, и
          # его id, совпав с пакетом alpine-базы caddy, тихо вырезал бы находку из отчёта,
          # по которому ниже принимается решение о выпуске.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            image --ignorefile /dev/null --format json --output trivy-caddy-release.json "$IMAGE:ci"

      # БЛОКИРУЮЩИЙ гейт №1 перед пушем: пересборка всё ещё делает то, ради чего она есть.
      # Скрипт падает и на пустом отчёте, то есть сорванный скан выше тоже останавливает
      # выпуск, а не пропускает его молча (fail-secure).
      - name: приёмка SEC-31 (блокирующая)
        run: .github/scripts/caddy-rebuild-acceptance.sh trivy-caddy-release.json

      # БЛОКИРУЮЩИЙ гейт №2, к сканеру ортогональный: образ реально стартует и обслуживает.
      - name: smoke before push (blocking)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: .github/scripts/smoke-caddy-image.sh "$IMAGE:ci"

      - name: push
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          short="${SHA:0:12}"
          docker tag "$IMAGE:ci" "$IMAGE:main"
          docker tag "$IMAGE:ci" "$IMAGE:sha-$short"
          docker push "$IMAGE:main"
          docker push "$IMAGE:sha-$short"
          # The digest is assigned by the registry on push — read it back rather than
          # computing it locally, so what we sign is exactly what a `docker pull` gets.
          ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:main" |
            grep "^$IMAGE@" | head -1)
          if [ -z "$ref" ]; then
            echo "::error::could not resolve the pushed digest — refusing to sign a tag"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pushed $ref"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      # SLSA build provenance — «чем и из чего собрано», в дополнение к подписи («кто
      # подписал»). Разбор пина (SHA коммита у аннотированного тега) — у джобы `publish`.
      - name: attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Keyless: сертификат Fulcio привязывает подпись к ЭТОМУ файлу воркфлоу + репозиторию
      # + коммиту. Креды реестра идут ФЛАГАМИ, а не смонтированным docker-конфигом — разбор
      # (distroless-образ cosign работает не от root) у джобы `publish` выше.
      - name: sign the digest (cosign, keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
          REF: ${{ steps.push.outputs.ref }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e COSIGN_EXPERIMENTAL \
            -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            -e ACTIONS_ID_TOKEN_REQUEST_URL \
            -e REGISTRY_USER \
            -e REGISTRY_TOKEN \
            ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31 \
            sign --yes \
            --registry-username "$REGISTRY_USER" \
            --registry-password "$REGISTRY_TOKEN" \
            "$REF"

      # Та же команда и те же ограничения на identity, что у deploy/verify-image.sh:
      # зелёная публикация, которую никто не может проверить, хуже отсутствия подписи.
      # Identity здесь тот же файл воркфлоу, что у сервера, — и это не небрежность:
      # ограничение адресует ВОРКФЛОУ, а проверяется подпись, привязанная к КОНКРЕТНОМУ
      # дайджесту, так что один скрипт проверяет оба образа и перепутать их нечем.
      - name: verify what we just signed
        env:
          REF: ${{ steps.push.outputs.ref }}
          REPO: ${{ github.repository }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -e REGISTRY_USER \
            -e REGISTRY_TOKEN \
            ghcr.io/sigstore/cosign/cosign@sha256:b03690aa52bfe94054187142fba24dc54137650682810633901767d8a3e15b31 \
            verify "$REF" \
            --registry-username "$REGISTRY_USER" \
            --registry-password "$REGISTRY_TOKEN" \
            --certificate-identity-regexp "^https://github.com/$REPO/\.github/workflows/image\.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            -o text

      - name: deploy instructions
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "## 🔒 Signed Caddy image published"
            echo ""
            echo "Публичный хост (TLS-оверлей). Оба образа — по дайджесту:"
            echo ""
            echo '```bash'
            echo "./deploy/verify-image.sh $REF   # cosign verify — сначала это"
            echo "docker pull $REF"
            echo "cd deploy && VOID_IMAGE=<серверный ref> VOID_CADDY_IMAGE=$REF \\"
            echo "  docker compose -f docker-compose.yml -f docker-compose.tls.yml \\"
            echo "    -f docker-compose.release.yml -f docker-compose.release-tls.yml up -d --no-build"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
