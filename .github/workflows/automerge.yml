name: Auto-merge

# ЗАЧЕМ. Ruleset на `main` не даёт влить PR с красным CI — и это правильно. Но «Enable
# auto-merge» остаётся РУЧНЫМ кликом на каждом pull request'е, а решение «влить, когда
# позеленеет» принимается один раз, в момент открытия PR. Этот воркфлоу нажимает кнопку
# за человека.
#
# ЧТО ЭТО НЕ ДЕЛАЕТ. Авто-мердж ничего не обходит: он лишь ставит PR в очередь на слияние
# ПОСЛЕ того, как все required checks позеленеют. Красный гейт — PR так и висит открытым.
# Если в ruleset'е включено «Require approvals», авто-мердж будет ждать ревью столько,
# сколько понадобится; свой собственный PR апрувить GitHub не даёт, так что при
# одиночной разработке этот пункт в ruleset'е и есть то, что заставляет кликать руками.
#
# ПОЧЕМУ `pull_request`, А НЕ `pull_request_target`. Второй дал бы write-права и на PR из
# форка, но запускается в контексте базовой ветки — классический футган. Здесь он не
# нужен: PR из форка авто-мерджить как раз НЕ хочется (чужой код влился бы без участия
# человека), а на ветках самого репозитория прав у `GITHUB_TOKEN` и так достаточно.
# Проверка на форк ниже написана явно, чтобы правило было видно, а не подразумевалось.
#
# ПРЕДУСЛОВИЕ. Settings → General → Pull Requests → «Allow auto-merge» должно быть
# включено, иначе API откажет. Шаг НЕ глушит эту ошибку намеренно: молча неработающая
# автоматизация хуже отсутствующей.

on:
  pull_request:
    # `synchronize` сознательно НЕ подписан: если человек выключил авто-мердж руками,
    # следующий же пуш в ветку включал бы его обратно — автоматика спорила бы с решением.
    types: [opened, reopened, ready_for_review]

permissions:
  # Включение авто-мерджа — это мутация pull request'а.
  pull-requests: write
  # Нужно на случай, когда PR уже зелёный в момент открытия: тогда `--auto` сливает
  # сразу, и слияние выполняется нашим токеном, а не отложенно самим GitHub.
  contents: write

jobs:
  enable:
    name: enable auto-merge
    runs-on: ubuntu-latest
    # Черновик — явное «ещё не готово». Форк — чужой код, ему нужен человек.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Идемпотентность через ЧТЕНИЕ состояния, а не через глушение ошибки: так
          # «уже включён» не смешивается с «Allow auto-merge выключен в настройках».
          if [ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest -q '.autoMergeRequest')" != "null" ]; then
            echo "авто-мердж уже включён — нечего делать"
            exit 0
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --merge
          echo "авто-мердж включён: PR вольётся, как только позеленеют required checks"
