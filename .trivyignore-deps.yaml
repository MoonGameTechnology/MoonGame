  # --- ТЕ ЖЕ CVE Go stdlib, но ТОЛЬКО в gosu — не трогая caddy ---
  # Вот ради чего менялся формат. Эти пять живут и в gosu, и в бинаре caddy. Обоснование
  # выше (gosu не видит недоверенного ввода) относится ТОЛЬКО к gosu; у caddy тот же CVE —
  # настоящий риск, потому что он терминирует TLS из интернета. `paths` разделяет эти два
  # случая: запись гасит находку в gosu и НЕ ТРОГАЕТ ту же находку в caddy, где она
  # остаётся видимой. Проверять после правок: в отчёте у `usr/bin/caddy` эти id обязаны
  # сохраниться, у `usr/local/bin/gosu` — исчезнуть.
  - id: CVE-2026-27145
    paths:
      - "usr/local/bin/gosu"
    expired_at: 2026-11-05
  - id: CVE-2026-39822
    paths:
      - "usr/local/bin/gosu"
    expired_at: 2026-11-05
