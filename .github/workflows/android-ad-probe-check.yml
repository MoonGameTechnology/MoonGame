name: Check immutable native ad probe 5979

# One-off owner's diagnostic: exercise the already verified APK bytes, not a
# fresh higher-version rebuild. Remove this workflow before the eventual PR.
on:
  push:
    branches: [fix/vk-ad-diagnostics-20261117]
    paths: ['.github/workflows/android-ad-probe-check.yml', 'mobile/minimal-ad/smoke.py']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.probe-android-user
      ANDROID_AVD_HOME: ${{ github.workspace }}/.probe-android-user/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch the immutable verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/MoonGameTechnology/MoonGame/actions/artifacts/14398302904/zip > "$RUNNER_TEMP/probe.zip"
          python3 - <<'PY'
          import os,zipfile,hashlib,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          data=(root/'probe.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='4e344ef0e0e65b3a39f80e6ac7a2585264a8c61663720065a16848ed3aaa16db'
          with zipfile.ZipFile(root/'probe.zip') as z:
              assert sorted(z.namelist())==['app-debug.apk','app-debug.apk.verification.json']
              apk=z.read('app-debug.apk')
          assert len(apk)==7103312 and hashlib.sha256(apk).hexdigest()=='0d45b6252898f976368582dd1da3dad378a4050a975276b00f44d6c38512db2e'
          (root/'probe.apk').write_bytes(apk)
          PY
      - name: Create an explicitly located AVD
        run: |
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$SDK_BIN/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;default;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK_BIN/avdmanager" create avd --name vk-ad-probe --package 'system-images;android-35;default;x86_64' --path "$ANDROID_AVD_HOME/vk-ad-probe.avd" --force
          test -f "$ANDROID_AVD_HOME/vk-ad-probe.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/vk-ad-probe.avd" > "$ANDROID_AVD_HOME/vk-ad-probe.ini"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
      - name: Install and press the real one-button APK offline
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd vk-ad-probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          PROBE_EMULATOR_PID=$!
          trap 'tail -n 60 "$RUNNER_TEMP/emulator.log"' ERR
          sleep 3
          kill -0 "$PROBE_EMULATOR_PID"
          python3 mobile/minimal-ad/smoke.py "$RUNNER_TEMP/probe.apk"
