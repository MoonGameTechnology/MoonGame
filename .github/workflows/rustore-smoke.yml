name: RuStore profile smoke
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'scripts/rustoreRelease.test.ts'
      - '.github/workflows/rustore*.yml'
      - 'pnpm-lock.yaml'
  merge_group:
permissions:
  contents: read
concurrency:
  group: rustore-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix mobile
      - name: Build and verify with disposable synthetic identity
        working-directory: mobile
        run: node rustore-smoke.mjs
      - name: Upload verification only (no APK or keys)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustore-synthetic-verification
          path: mobile/dist/rustore-smoke.json
          if-no-files-found: error
          retention-days: 14
