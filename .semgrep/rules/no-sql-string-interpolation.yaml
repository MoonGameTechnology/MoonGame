rules:
  - id: no-sql-string-interpolation
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      SQL injection (SD-1.3): interpolating a value into a query template literal.
      Always parameterize ($1, $2, ... — see packages/server/src/store/postgres.ts)
      instead of splicing values into the query string.
    # AST `pattern:` can't see through TS generic call type args (`.query<Row>(...)`,
    # used everywhere reads happen) — regex on the call+template text instead.
    #
    # ДВЕ формы склейки, а не одна. Первая — интерполяция в шаблон. Вторая —
    # конкатенация `'SELECT …' + value`: правило её не видело, и мутационная проверка
    # (SD-1.3) это поймала — подменённый на конкатенацию `seatOf` прошёл бы сканер и
    # упал только на живой базе. Ограничение формы честное: ловится запрос, ПЕРВЫЙ
    # аргумент которого начинается со строкового литерала и продолжается `+`; запрос,
    # собранный в переменную заранее, статике этого вида не виден вовсе — его держат
    # тесты на живой базе (`store/sqlInjection.test.ts`).
    pattern-either:
      - pattern-regex: '\.query(?:<[^>]*>)?\(\s*`[^`]*\$\{'
      - pattern-regex: '\.query(?:<[^>]*>)?\(\s*(?:`[^`]*`|''[^'']*''|"[^"]*")\s*\+'
    paths:
      include:
        - packages
      exclude:
        - "*.test.ts"
