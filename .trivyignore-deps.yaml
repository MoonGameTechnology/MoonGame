  # --- caddy: блок СНЯТ в SEC-31 ---
  # Здесь стояли девять подавлений пакетов базовой Alpine образа caddy (curl, libcurl,
  # c-ares). Они осиротели: caddy мы теперь собираем сами, в compose у него нет строки
  # `image:`, и джоба `trivy-deps` его больше не сканирует — этим занимается `trivy-caddy`,
  # которая ignorefile НЕ подключает. То есть записи перестали на что-либо влиять, а
  # мёртвое подавление хуже отсутствующего: оно читается как действующее решение.
  # Сами находки никуда не делись (рантайм-база та же) и теперь видны в отчёте
  # `trivy-caddy` без подавления — это осознанно, разбор в записи SEC-30 (pipeline.md).
  # На postgres они не распространялись: curl и c-ares в том образе отсутствуют.
