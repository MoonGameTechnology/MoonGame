# Void Dominion — the WHOLE stack in one command (REL-3, decided deploy: self-hosted VPS):
#
#   cd deploy && docker compose up -d --build   # Postgres + game server, self-healing
#
# What you get:
#   http://<host>:8788/        — the game (players just open the link; wss:// auto-fills)
#   http://<host>:8788/health  — liveness (the container healthcheck hits it too)
# Fault tolerance:
#   - restart: unless-stopped on BOTH services — a crash/OOM/reboot self-heals
#     (enable `systemctl enable docker` so the daemon itself starts on boot).
#   - Durable matches: the server snapshots to Postgres (DATABASE_URL below), so a
#     server restart RESUMES the running match instead of losing it; pg data lives
#     in the `void-pgdata` volume and survives container re-creation.
#   - Healthchecks gate startup order (server waits for a HEALTHY postgres) and feed
#     Docker's restart decisions; logs are bounded so they can't fill the disk.
#   - Backups/updates/restore: see deploy/README.md (runbook).
# Postgres is bound to 127.0.0.1 ONLY — never exposed publicly (the server reaches it
# over the compose network). Set a real POSTGRES_PASSWORD in the environment (or an
# .env file next to this compose) for anything beyond a local test.
#
# CONTAINER HARDENING (SEC-12). NOTE FOR FUTURE EDITS: no scanner checks this file.
# Trivy's misconfig engine covers Dockerfile/k8s/terraform/cloudformation/helm/ARM —
# Docker Compose is NOT among its formats, so the runtime posture below (privileges,
# capabilities, limits) is held by review + the checklist in deploy/README.md, not by
# CI. Keep them in sync when you touch a service.
#   - no-new-privileges: a process in the container can never gain privileges via a
#     setuid binary — closes the classic in-container escalation step.
#   - cap_drop [ALL]: our server needs no Linux capability at all (non-root node on a
#     >1024 port). Postgres's entrypoint does (chown/setuid of the data dir) — see the
#     note on that service.
#   - mem_limit / pids_limit: a runaway (leak, fork bomb, OOM in one service) hits a
#     wall instead of taking the whole VPS — and with restart: unless-stopped it
#     self-heals. Values are for a small (2 GB) VPS; raise them if the host is bigger.
# Third-party images are digest-pinned (A08, same rule as the Dockerfile bases): a tag
# is mutable, a digest names the exact image reviewed. `trivy-deps` in security.yml
# reads these very lines and scans whatever they point at.
services:
  server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Default 0.0.0.0 — the plain LAN/quick path (players open http://<host>:8788).
      # For a public TLS deploy set SERVER_BIND=127.0.0.1 and put Caddy in front
      # (docker-compose.tls.yml) so the plain port isn't exposed to the internet.
      - '${SERVER_BIND:-0.0.0.0}:8788:8788'
    environment:
      PORT: 8788
      # Release posture: only validated action.v1 envelopes are accepted (the bundled
      # client auto-detects via welcome.gated). Set GATE=0 to fall back to bare actions.
      GATE: ${GATE:-1}
      # Release posture: seat tickets — a nick's first join mints a secret its client
      # stores and must present to reconnect, so a URL+nick alone can't take a seat.
      # Set SEAT_LOCK=0 to fall back to the open dev handshake.
      SEAT_LOCK: ${SEAT_LOCK:-1}
      # Wall→game clock multiplier. The FIRST playtest session runs ×24 (SES-2.6:
      # 1 real hour = 1 game day — a full session cycle inside days, not weeks);
      # the absence/entry windows stay in REAL time regardless (3d grace, 4d join).
      # Set TIME_SCALE=1 for the real-time 24/7 posture.
      TIME_SCALE: ${TIME_SCALE:-24}
      # Accounts (SES-2.5): set a real secret to switch the playable path to full
      # register/login (session JWT + join tokens; nick/ticket handshakes refused).
      # Unset ⇒ the nick+ticket flow (zero-setup LAN playtests). Keep the secret
      # STABLE across restarts or every player must log in again.
      # SECURITY: if you bind to a public interface (default 0.0.0.0), set a real
      # secret here. An empty secret + public bind = unauthenticated playtest mode
      # (anyone who knows a nick can take a seat). The server logs a stderr warning
      # if HOST=0.0.0.0 and AUTH_JWT_SECRET is empty.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      # Production posture (SEC-1 / MP-1): fail-secure — refuses to boot if any of
      # GATE/SEAT_LOCK/AUTH_JWT_SECRET is unset on a public bind. Defaults ON so a
      # plain `docker compose up` against the public interface is safe. Override
      # with PROD=0 for explicit dev-mode (loopback / LAN playtest).
      PROD: ${PROD:-1}
      # How many independent sessions this ONE process hosts (proto, proto-2, …):
      # all appear in the in-game match browser; each is durable in Postgres.
      MATCHES: ${MATCHES:-1}
      # Durable matches: snapshots to the postgres service over the compose network.
      DATABASE_URL: postgres://void:${POSTGRES_PASSWORD:-void}@postgres:5432/void
      # TLS / wss (RS-5.1): point BOTH at PEM files mounted under ./certs (see the
      # `certs` volume below and deploy/README.md for issuing a Let's Encrypt cert) and
      # the server serves wss:// in-process — no reverse proxy needed. Unset ⇒ plain ws
      # (a proxy like Nginx/Caddy may terminate TLS upstream instead — setup-proxy.sh).
      # Setting only one of the two is a boot error (fail-secure — no silent cleartext).
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      # Behind a TLS-terminating proxy instead, set TRUST_PROXY=1 so per-IP rate limits
      # see the real client, not the proxy.
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      postgres:
        condition: service_healthy
    # NETA2-mon: keep the per-match event JSONL (playtest-logs/) on a named volume so a
    # container restart/redeploy doesn't wipe the record you'd read to see what went
    # wrong. WORKDIR is /app, so the server writes /app/playtest-logs.
    volumes:
      - void-logs:/app/playtest-logs
      # TLS certs (RS-5.1): host ./certs → /certs (read-only). Drop a Let's Encrypt
      # privkey.pem + fullchain.pem here and set TLS_KEY_FILE=/certs/privkey.pem
      # TLS_CERT_FILE=/certs/fullchain.pem above. Harmless (empty) when TLS is off.
      - ./certs:/certs:ro
    # The image bakes its own HEALTHCHECK (GET /health); compose inherits it.
    # Hardening (SEC-12; rationale in the header). No `read_only: true` here on purpose:
    # netserver.mjs esbuild-transpiles the server INTO /app/packages/server/dist at every
    # startup and appends match JSONL to /app/playtest-logs, so the root FS must stay
    # writable. The image already runs as non-root (uid 65532), which is what read_only
    # would mostly be buying.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  postgres:
    # Digest-pinned (A08). To bump: re-resolve the tag's digest and re-run the deploy —
    # procedure + one-liner in docs/security/image-pinning.md. Refreshed 2026-07.
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: void
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-void}
      POSTGRES_DB: void
    ports:
      - '127.0.0.1:5432:5432' # loopback only — psql/pg_dump from the host; never public
    volumes:
      - void-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U void -d void']
      interval: 10s
      timeout: 5s
      retries: 5
    # Hardening (SEC-12). Only the two settings that cannot break the official entrypoint:
    # it starts as root to chown/initdb the data dir and then drops to the `postgres` user
    # (a privilege DROP, which no-new-privileges does not block). `cap_drop: [ALL]` is
    # deliberately NOT set here — that entrypoint needs CHOWN/DAC_OVERRIDE/FOWNER/SETUID/
    # SETGID, and getting the add-back list wrong breaks the DB on the next restart, so it
    # is an opt-in step to verify on a staging host first (recipe in deploy/README.md).
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  void-pgdata:
  void-logs:
