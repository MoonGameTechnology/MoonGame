name: Security scan

# Security pipeline. Runs a DIVERSE set of scanners on EVERY push (any branch) —
# different methods / data sources / surfaces, not clones — aggregates everything
# into ONE report, and posts it back (sticky PR comment, or a commit comment
# otherwise) + job summary + artifact.
#
# === GATING (SEC-1 ratchet) ===
#
# Triaged scanners are BLOCKING: semgrep, gitleaks, osv, trivy-fs, trivy-image.
# Baseline was fixed at ZERO findings (triage 2026-07-10: local gitleaks v8.18.4 +
# pnpm audit runs, CI runs of the pinned images — all clean; the only accepted
# suppressions are the justified base-image CVEs in .trivyignore). Their gate step
# fails the job on ANY non-zero scanner exit — findings AND scanner/infra failures
# both block (fail-secure, OWASP A10): a scanner that couldn't run can't certify.
# New suppressions go to .semgrepignore / .gitleaks.toml / .trivyignore WITH a
# reason + date (see docs/security/pipeline.md).
# Still informational (not yet triaged as bricks): codeql, trufflehog, trivy-deps,
# dependency-check, zizmor, scorecard, and the `check` job (its blocking twin lives in
# ci.yml).
#
# Each scan job writes a `status-<key>.json` sentinel AFTER the scan with the real
# exit code / outcome. The summarizer LEADS with a scan-confirmation table built from
# those sentinels, so a silently-failed scanner is flagged "⚠️ NOT confirmed" instead
# of a misleading quiet "0 findings" (anti fail-open — audit F-08).
#
# === SECURITY HARDENING (SEC-3) ===
#
# Hardening (self-flagged by the zizmor job): every checkout sets
# `persist-credentials: false` (jobs only read — none push — so the workflow token
# must not linger in .git/config, artifact/credential-persistence), and every
# `${{ steps.*.outcome }}` is read via an `env:` var (`$VAR`) instead of being
# expanded inline into a `run:` shell (template-injection prevention).
#
# Actions are SHA-pinned (SD-6.1 / F-16) with a trailing `# vN` for readability.
#
# Docker images are pinned by sha256 digest (supply-chain integrity):
#   - All scanners: semgrep, gitleaks, trufflehog, osv-scanner, trivy, syft, zizmor
#   - Reason: prevents tag reuse / MITM / registry compromise attacks
#   - Update method: ./.github/scripts/update-image-digests.sh (re-pin every month)
#   - See docs/security/image-pinning.md for details
#   - Last updated: 2026-07
#
# Variables and secrets (least privilege):
#   - Secrets ALWAYS use ${{ secrets.NAME }} (auto-masked in logs)
#   - Permissions: each job declares ONLY what it needs (contents/pull-requests/issues)
#   - Protected branches: main requires green checks + code review (prevents direct push)
#   - GITHUB_TOKEN (auto-rotated) used instead of long-lived PAT
#   - See docs/security/ci-variables.md for guidelines
#
# This workflow is itself checked by zizmor (GitHub Actions security scanner).
#
# === WHY THE WEEKLY SCHEDULE (SEC-10) ===
#
# Push-triggered scanning certifies a COMMIT, not a RUNNING DEPLOY. Our bases are
# digest-pinned, so a long-lived deploy keeps running the exact image that was scanned
# at merge time while the CVE feeds move under it — nobody looks until someone happens
# to push. The Monday cron re-scans `main` (same jobs, same blocking gates) so a CVE
# published against the pinned base surfaces as a failed run within a week, not
# whenever the next commit lands.

on:
  push:
    branches: ['**']
  schedule:
    # Monday 05:17 UTC. Off-the-hour minute: GitHub drops cron runs queued at peak
    # times (:00 is the worst), and a rescan that silently never ran is fail-open.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: lint + typecheck + test + audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm run check
        id: check
        continue-on-error: true
        run: pnpm run check
      # pnpm audit retired: npm shut down both audit endpoints (HTTP 410, 2026-07).
      # SCA over the lockfiles is carried by the BLOCKING osv job below (osv.dev
      # mirrors GHSA) and by ci.yml's OSV step — no separate audit sentinel.
      - name: sentinels
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "{\"check\":\"$CHECK_OUTCOME\"}" > check-status.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check
          path: |
            check-status.json
          if-no-files-found: warn

  semgrep:
    name: SAST patterns (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep — custom rule unit tests (SEC-2)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 \
            semgrep --test .semgrep/rules --metrics=off
      - name: semgrep
        id: scan
        run: |
          set +e
          # --error → exit 1 on findings (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 \
            semgrep scan --config=p/typescript --config=p/javascript --config=p/security-audit --config=.semgrep/rules \
            --error --sarif --output=semgrep.sarif --metrics=off
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s semgrep.sarif ] || ok=false
          echo "{\"key\":\"semgrep\",\"ok\":$ok,\"exit\":$rc}" > status-semgrep.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-semgrep
          path: |
            semgrep.sarif
            status-semgrep.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Semgrep is a blocking scanner (SEC-1): findings or scan failure (exit $RC). Fix the finding or suppress WITH justification (.semgrepignore / nosemgrep + reason)."
            exit 1
          fi

  codeql:
    name: SAST dataflow (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
      - id: cqa
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: codeql
          output: codeql-out
          upload: always
      - name: sentinel
        if: always()
        env:
          CQA_OUTCOME: ${{ steps.cqa.outcome }}
        run: |
          ok=false
          if [ "$CQA_OUTCOME" = "success" ]; then ok=true; fi
          echo "{\"key\":\"codeql\",\"ok\":$ok}" > status-codeql.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-codeql
          path: |
            codeql-out/**/*.sarif
            status-codeql.json
          if-no-files-found: warn

  gitleaks:
    name: Secrets — tree (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks
        id: scan
        run: |
          set +e
          # TODO: Update to sha256 digest — run: ./.github/scripts/update-image-digests.sh
          # Currently pinned by tag (v8.18.4); sha256 provides supply-chain integrity
          # exits 1 on leaks by default (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks:v8.18.4 \
            detect --source=/src --no-git --redact \
            --report-format sarif --report-path gitleaks.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s gitleaks.sarif ] || ok=false
          echo "{\"key\":\"gitleaks\",\"ok\":$ok,\"exit\":$rc}" > status-gitleaks.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-gitleaks
          path: |
            gitleaks.sarif
            status-gitleaks.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Gitleaks is a blocking scanner (SEC-1): leak found or scan failure (exit $RC). Rotate the secret; allowlist ONLY known-public fixtures via .gitleaks.toml WITH justification."
            exit 1
          fi

  trufflehog:
    name: Secrets — history + verify (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the differentiator vs Gitleaks (--no-git)
          persist-credentials: false
      - name: trufflehog
        continue-on-error: true
        run: |
          set +e
          # stderr НЕ выбрасывается: stdout уже занят NDJSON-отчётом, поэтому лог джобы —
          # единственное место, где может уцелеть причина падения скана (было `2>/dev/null`).
          docker run --rm -v "$PWD:/src" -w /src trufflesecurity/trufflehog@sha256:de8ef4e573653b30c002e3491bf0484d23e31b73fe5519db6b395408e6834d4f \
            git file:///src --json --no-update > trufflehog.json
          rc=$?
          set -e
          # ЛЮБОЙ ненулевой код — это «скан не отработал», а не «нашлись секреты: без
          # `--fail` находки на код выхода не влияют (упавший скан выходит 1). Проверки
          # `[ -s trufflehog.json ]`, как у остальных сканеров, здесь быть НЕ может: пустой
          # файл — легитимный чистый результат, она давала бы ложную тревогу. Поэтому
          # ливнес-проверка идёт по коду выхода — она ортогональна находкам.
          ok=true; [ "$rc" -eq 0 ] || ok=false
          echo "{\"key\":\"trufflehog\",\"ok\":$ok,\"exit\":$rc}" > status-trufflehog.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trufflehog
          path: |
            trufflehog.json
            status-trufflehog.json
          if-no-files-found: warn

  osv:
    name: SCA — osv.dev (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        id: scan
        run: |
          set +e
          # TODO: Update to sha256 digest — run: ./.github/scripts/update-image-digests.sh
          # Supply-chain integrity: pin image digest to prevent tag reuse attacks
          # exits 1 on vulnerabilities by default (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v1.9.1 \
            --lockfile=pnpm-lock.yaml --lockfile=mobile/package-lock.json \
            --format=sarif --output=osv.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s osv.sarif ] || ok=false
          echo "{\"key\":\"osv\",\"ok\":$ok,\"exit\":$rc}" > status-osv.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-osv
          path: |
            osv.sarif
            status-osv.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::OSV-Scanner is a blocking scanner (SEC-1): vulnerability found or scan failure (exit $RC). Update the dependency; ignore ONLY with [[IgnoredVulns]] in osv-scanner.toml WITH justification + expiry."
            exit 1
          fi

  trivy-fs:
    name: Vuln + IaC — files (Trivy fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy fs
        id: scan
        run: |
          set +e
          # TODO: Update to sha256 digest — run: ./.github/scripts/update-image-digests.sh
          # Pin docker image digest for supply-chain integrity (prevents tag hijacking)
          # --exit-code 1 → exit 1 on findings (blocking, SEC-1); .trivyignore applies
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy:0.58.2 \
            fs --scanners vuln,secret,misconfig --exit-code 1 --format sarif --output trivy.sarif .
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s trivy.sarif ] || ok=false
          echo "{\"key\":\"trivy-fs\",\"ok\":$ok,\"exit\":$rc}" > status-trivy-fs.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-fs
          path: |
            trivy.sarif
            status-trivy-fs.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Trivy fs is a blocking scanner (SEC-1): finding or scan failure (exit $RC). Fix it; suppress ONLY via .trivyignore WITH CVE-id, reason and review date."
            exit 1
          fi

  trivy-image:
    name: Vuln — built image base OS (Trivy image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        continue-on-error: true
        run: docker build -t void-dominion:scan .
      - name: trivy image + image SBOM
        id: scan
        run: |
          set +e
          # TODO: Update to sha256 digests — run: ./.github/scripts/update-image-digests.sh
          # Docker image pinning (aquasec/trivy + anchore/syft) for supply-chain integrity
          # --exit-code 1 → exit 1 on findings (blocking, SEC-1); .trivyignore applies
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            aquasec/trivy:0.58.2 image --exit-code 1 --format sarif --output trivy-image.sarif void-dominion:scan
          rc=$?
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            anchore/syft:v1.20.0 scan void-dominion:scan -o cyclonedx-json=sbom-image.cdx.json
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s trivy-image.sarif ] || ok=false
          echo "{\"key\":\"trivy-image\",\"ok\":$ok,\"exit\":$rc}" > status-trivy-image.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-image
          path: |
            trivy-image.sarif
            sbom-image.cdx.json
            status-trivy-image.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Trivy image is a blocking scanner (SEC-1): finding or scan/build failure (exit $RC). Fix the image; suppress ONLY via .trivyignore WITH CVE-id, reason and review date."
            exit 1
          fi

  trivy-deps:
    name: Vuln — third-party prod images (Trivy image)
    # SEC-11: `trivy-image` above scans OUR image only. Production runs two more
    # containers nobody was scanning — postgres and caddy from deploy/. Their refs are
    # READ OUT OF THE COMPOSE FILES here (not a second hardcoded list), so a digest bump
    # in deploy/ can't drift away from what CI actually scans.
    # Informational on landing (the SEC-6 pattern): third-party base images carry CVEs
    # we don't control, so this becomes blocking only after the first triage — otherwise
    # an upstream advisory would redden `main` with nothing to fix in this repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy image — postgres/caddy referenced by deploy/
        id: scan
        continue-on-error: true
        run: |
          set +e
          mkdir -p trivy-deps-sarif
          # Only the two base compose files: docker-compose.release.yml pins OUR image,
          # which trivy-image already scans at build time.
          refs=$(grep -hE '^[[:space:]]+image: ' deploy/docker-compose.yml deploy/docker-compose.tls.yml |
            awk '{print $2}' | sort -u)
          echo "refs to scan:"; echo "$refs"
          rc=0
          fail=0
          i=0
          for ref in $refs; do
            i=$((i + 1))
            # No docker-socket mount: these are registry refs, so Trivy pulls them itself
            # (the socket is only needed for the locally-built image in trivy-image).
            # --exit-code 1 → findings are visible in $rc; the gate stays informational.
            # --ignorefile: СВОЙ список подавлений (.trivyignore-deps), не корневой.
            # Корневой обслуживает блокирующие trivy-fs/trivy-image над нашим кодом и
            # образом; чужой CVE, записанный туда, ослабил бы заодно и их (SEC-14).
            docker run --rm -v "$PWD:/out" -w /out \
              aquasec/trivy:0.58.2 image --exit-code 1 --format sarif \
              --ignorefile .trivyignore-deps \
              --output "trivy-deps-sarif/trivy-deps-$i.sarif" "$ref"
            r=$?
            # Отличаем НАХОДКИ от СБОЯ: `--exit-code 1` даёт ровно 1, когда CVE найдены;
            # всё остальное ненулевое (не спулился образ, нет сети, сдох сканер) — это
            # «скан не состоялся». Раньше оба случая сливались в один rc, и упавший пул
            # одного из двух образов проходил как «просканировано» — а предупреждение
            # внизу ещё и списывало это на найденные CVE.
            case $r in
              0) ;;
              1) rc=1 ;;
              *) fail=$r ;;
            esac
          done
          set -e
          ok=true
          [ "$fail" -eq 0 ] || ok=false
          [ "$i" -gt 0 ] || ok=false          # grep matched nothing ⇒ scanned nothing
          # По одному SARIF на КАЖДУЮ ссылку: непустого каталога мало — при двух образах
          # отчёт от первого маскировал бы полное отсутствие второго.
          [ "$(ls -1 trivy-deps-sarif | wc -l)" -eq "$i" ] || ok=false
          echo "{\"key\":\"trivy-deps\",\"ok\":$ok,\"exit\":$rc,\"fail\":$fail}" > status-trivy-deps.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-deps
          path: |
            trivy-deps-sarif/*.sarif
            status-trivy-deps.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-deps-sarif
          category: trivy-deps
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
          FAIL: ${{ steps.scan.outputs.fail }}
        run: |
          # Сбой скана и найденные CVE — РАЗНЫЕ сообщения: раньше упавший пул образа
          # печатался как «Trivy нашёл CVE», то есть авария маскировалась под находку.
          if [ "$FAIL" != "0" ]; then
            echo "::error::trivy-deps: скан НЕ состоялся (код $FAIL) — образ не спулился или сканер не отработал. Сентинел помечен ok:false, отчёт покажет «НЕ подтверждён»."
          fi
          if [ "$RC" != "0" ]; then
            echo "::warning::Trivy found CVEs in the third-party prod images (exit $RC). Informational for now — triage them, then flip this job to blocking (SEC-11)."
          fi

  dependency-check:
    name: SCA — NVD/CPE (OWASP Dependency-Check)
    # SEC-15. A SECOND SCA engine over the same dependencies, deliberately different from
    # OSV/Trivy: those resolve advisories by package identity (GHSA/OSV records keyed to an
    # ecosystem name), this one matches CPEs straight out of the NVD feed. Different
    # matching ⇒ different blind spots, which is the whole reason the pipeline runs a
    # diverse set rather than clones.
    #
    # KNOWN COST, ACCEPTED ON LANDING:
    #   - CPE matching is noisy on npm (a package whose name collides with some vendor's
    #     product inherits its CVEs), so this is INFORMATIONAL until triaged — same
    #     ratchet as trivy-deps/dast-zap. Do not make it blocking before that triage.
    #   - It cannot read `pnpm-lock.yaml` (its Node analyzers understand package.json +
    #     npm/yarn lockfiles). So we install first and let it walk the real node_modules
    #     tree — without that install this job would quietly scan almost nothing, which
    #     is the fail-open shape this pipeline exists to avoid.
    #   - The NVD feed download is slow; the data dir is cached across runs and only
    #     incrementally updated, hence the generous timeout.
    #
    # MEASURED ON THE FIRST LIVE RUN (2026-07-30, run 30579763480) — two corrections:
    #   1. It died after 40 minutes with `Unable to obtain an exclusive lock on the H2
    #      database` + `No documents exist` (exit 13). Cause: the container does not run as
    #      the runner's user, so it could not write/lock the H2 store inside the
    #      bind-mounted data dir. Fixed by running it as the runner uid:gid — the
    #      upstream-documented invocation — so the mounted dir it must own is actually
    #      writable. (The empty 185-byte cache that run saved is why the key prefix is
    #      now v2: the old prefix would restore that poisoned empty dir forever.)
    #   2. NOT ON EVERY PUSH any more. Even failing took 40 minutes; a successful first
    #      feed sync is not going to be dramatically cheaper, and a scanner that slow does
    #      not belong in the PR feedback loop. It runs on the weekly cron and on manual
    #      dispatch, where its duration costs nobody anything. On a push it is SKIPPED BY
    #      DESIGN — and the summarizer knows that, so it prints "⏭ skipped", not the
    #      "NOT confirmed" alarm (which must keep meaning "a scan that should have run
    #      didn't"). Move it back onto push only if a measured run turns out to be fast.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # Rate-limit token for the NVD API. Without it the feed sync crawls and the job is
      # useless, so a missing secret is reported as an UNCONFIRMED scan (below) instead of
      # a quiet green.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore the NVD database between runs: a cold sync pulls the whole feed, a warm
      # one is incremental. Immutable key + prefix restore-keys = always save a fresh
      # entry, always start from the newest previous one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dc-data
          key: dc-nvd-v2-${{ github.run_id }}
          restore-keys: dc-nvd-v2-
      - name: dependency-check
        id: scan
        if: env.NVD_API_KEY != ''
        continue-on-error: true
        run: |
          set +e
          mkdir -p dc-data dc-report
          # `-u` is load-bearing, not hygiene: without it the container user cannot lock
          # the H2 database inside the bind-mounted data dir, and the run dies after
          # ~40 minutes of feed sync with "Unable to obtain an exclusive lock" (seen live,
          # exit 13). Running as the runner's own uid:gid — the upstream-documented
          # invocation — makes both mounted dirs writable, since the runner created them.
          # Image digest-pinned (A08), resolved from the registry — same rule as every
          # other scanner here. The key goes in as an argument read from the environment;
          # Actions masks the secret in logs.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$PWD/dc-data:/usr/share/dependency-check/data" \
            owasp/dependency-check@sha256:ad169904106250816059f113d374d63a49a7cb0fd2c5e476d05c4fb814cc77b9 \
            --scan /src --out /src/dc-report --format SARIF \
            --project void-dominion --nvdApiKey "$NVD_API_KEY"
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s dc-report/dependency-check-report.sarif ] || ok=false
          echo "{\"key\":\"dependency-check\",\"ok\":$ok,\"exit\":$rc}" > status-dependency-check.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: no key — report as NOT confirmed
        if: env.NVD_API_KEY == ''
        run: |
          echo "::warning::NVD_API_KEY is not set — Dependency-Check did not run. Add the secret (Settings → Secrets and variables → Actions)."
          echo '{"key":"dependency-check","ok":false,"exit":"no-key"}' > status-dependency-check.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-dependency-check
          path: |
            dc-report/dependency-check-report.sarif
            status-dependency-check.json
          if-no-files-found: warn
      - name: upload to code scanning
        if: env.NVD_API_KEY != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: dc-report/dependency-check-report.sarif
          category: dependency-check
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ -n "$RC" ] && [ "$RC" != "0" ]; then
            echo "::warning::Dependency-Check finished with exit $RC (findings or scan failure). Informational until the CPE false-positive pass is done (SEC-15)."
          fi

  dast-zap:
    name: DAST — running server (ZAP baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: boot the server (in-memory, no DATABASE_URL — auth/gate default off, F1)
        run: |
          pnpm run dev:server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8787/health > /dev/null || { echo "::error::server did not become healthy"; cat server.log; exit 1; }
      - name: zap baseline
        id: scan
        continue-on-error: true
        run: |
          set +e
          # The zaproxy image runs as a non-root `zap` user; the runner's checkout dir
          # isn't writable by it, so ZAP would silently fail to write zap.yaml/reports
          # (AccessDeniedException) while the job still reported success. Mount a
          # dedicated, world-writable subdir instead of the whole repo root.
          mkdir -p zap-wrk
          chmod 777 zap-wrk
          # TODO: Update to sha256 digest — run: ./.github/scripts/update-image-digests.sh
          # ghcr.io/zaproxy/zaproxy@sha256 pin snapped live from the registry API (SEC-3).
          # --network host: the target is the bare node process on the runner, not a
          # container — ZAP reaches it via localhost like trivy-image reaches the socket.
          docker run --rm --network host -v "$PWD/zap-wrk:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
            zap-baseline.py -t http://localhost:8787 -r zap-report.html -J zap-report.json
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s zap-wrk/zap-report.json ] || ok=false
          echo "{\"key\":\"dast-zap\",\"ok\":$ok,\"exit\":$rc}" > status-dast-zap.json
      - name: stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-dast-zap
          path: |
            zap-wrk/zap-report.html
            zap-wrk/zap-report.json
            status-dast-zap.json
            server.log
          if-no-files-found: warn

  sbom:
    name: SBOM — files (Syft / CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: syft sbom
        continue-on-error: true
        run: |
          set +e
          # TODO: Update to sha256 digest — run: ./.github/scripts/update-image-digests.sh
          # Image pinning: anchore/syft by digest for supply-chain integrity
          docker run --rm -v "$PWD:/src" -w /src anchore/syft:v1.20.0 \
            scan dir:/src -o cyclonedx-json=sbom.cdx.json
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s sbom.cdx.json ] || ok=false
          echo "{\"key\":\"sbom\",\"ok\":$ok,\"exit\":$rc}" > status-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-sbom
          path: |
            sbom.cdx.json
            status-sbom.json
          if-no-files-found: warn

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          docker run --rm -e GH_TOKEN -v "$PWD:/src" -w /src ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --format sarif . > zizmor.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s zizmor.sarif ] || ok=false
          echo "{\"key\":\"zizmor\",\"ok\":$ok,\"exit\":$rc}" > status-zizmor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-zizmor
          path: |
            zizmor.sarif
            status-zizmor.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  scorecard:
    name: Repo posture (OpenSSF Scorecard)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # posture checks are meaningful on the default branch
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sc
        continue-on-error: true
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: sentinel
        if: always()
        env:
          SC_OUTCOME: ${{ steps.sc.outcome }}
        run: |
          ok=false
          if [ "$SC_OUTCOME" = "success" ]; then ok=true; fi
          echo "{\"key\":\"scorecard\",\"ok\":$ok}" > status-scorecard.json
      - name: upload to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-scorecard
          path: |
            scorecard.sarif
            status-scorecard.json
          if-no-files-found: warn

  report:
    name: summarize + report
    needs:
      [
        check,
        semgrep,
        codeql,
        gitleaks,
        trufflehog,
        osv,
        trivy-fs,
        trivy-image,
        trivy-deps,
        dependency-check,
        dast-zap,
        sbom,
        zizmor,
        scorecard,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit comments
      pull-requests: write # PR comments
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports
      - name: summarize
        run: node .github/scripts/summarize-security.mjs reports security-report.md
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # Нужен, чтобы отличить «пропущено по дизайну» (schedule-only джоба на push)
          # от «скан не подтверждён».
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: job summary
        run: cat security-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: |
            security-report.md
            reports/**/*.sarif
            reports/**/*.cdx.json
          if-no-files-found: warn
      - name: post report (sticky PR comment or commit comment)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // Weekly rescan (SEC-10) runs on `main`, where there is no PR to stick the
            // comment to — it would drop a fresh commit comment on the same head commit
            // every Monday. The run's own red/green + job summary is the signal there.
            if (context.eventName === 'schedule') {
              core.info('scheduled rescan — report stays in the job summary/artifacts');
              return;
            }
            const marker = '<!-- void-security-report -->';
            const body = marker + '\n' + fs.readFileSync('security-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let prs = [];
            try {
              const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
              prs = res.data.filter((p) => p.state === 'open');
            } catch (e) {
              core.warning('PR lookup failed: ' + e.message);
            }
            if (prs.length) {
              for (const pr of prs) {
                const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
                const existing = comments.find((c) => c.body && c.body.includes(marker));
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
              }
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body });
            }
