name: CI

# The gate for every push to main and every PR: lint + typecheck + test + audit.
# A Postgres service is attached and DATABASE_URL is set, so the durable-path adapter
# tests (store.test.ts, gated behind DATABASE_URL) actually run in CI instead of being
# skipped — the production persistence path is exercised, not just the in-memory one.
# Actions are SHA-pinned (SD-6.1 / F-16) with a trailing `# vN` for readability, and
# checkout sets `persist-credentials: false` (the job only reads) — same hardening as
# security.yml, self-flagged by its zizmor job.

# ТРИГГЕРЫ. Раньше гейт бежал только на `main` и на pull_request — то есть пуш в фиче-ветку
# не проверялся ВООБЩЕ, и обратная связь появлялась лишь в момент открытия PR. Локально
# правило «перед коммитом гоняй pnpm run check» машиной не принуждается (git-хуков в репо
# нет), так что до открытия PR красный код мог жить в ветке сколько угодно. Теперь гейт
# бежит на push в любую ветку. `concurrency` ниже гасит дубль «push + pull_request» на
# одной и той же ветке: побеждает последний прогон, предыдущий отменяется.
on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint · typecheck · test · audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: void_test
        ports:
          - 5432:5432
        # Wait until the DB accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # store.test.ts runs its Postgres adapter contracts only when this is set; every
      # other test either uses in-memory stores or passes an explicit empty env.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/void_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Gate (lint + typecheck + test, incl. Postgres adapters)
        run: pnpm run check

      # SCA over the same lockfiles the security workflow scans. `pnpm audit` is
      # retired here: npm shut down both audit endpoints (HTTP 410, 2026-07) and
      # pnpm has no bulk-advisory client yet — OSV-Scanner queries osv.dev (which
      # mirrors GHSA) instead. Exits non-zero on findings AND on scanner failure
      # (fail-secure: a scanner that couldn't run can't certify).
      - name: Dependency audit (OSV-Scanner)
        run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner:v1.9.1 \
            --lockfile=pnpm-lock.yaml --lockfile=mobile/package-lock.json

      # M2 perf report (metrics-roadmap): CPU frame cost of the prototype's render
      # loop (idle/pan/zoom) against the p95 budget. Non-blocking by design — the
      # report shows up in the job log for review; flip to PERF_STRICT=1 to gate.
      - name: Perf report (non-blocking)
        run: pnpm run perf
        continue-on-error: true

      # Boots the BUILT prototype in a real headless browser and fails on any console
      # error. `pnpm run check` cannot see this class of defect: prototype/ is outside
      # ESLint and tsc, and uitest/perf drive a fake DOM — esbuild-only bugs, unhandled
      # rejections and browser warnings show up nowhere else. Non-blocking for now (same
      # posture as perf): the runner has to fetch a Chromium, so let it prove itself in
      # the log before it can redden main.
      - name: Browser smoke (non-blocking)
        run: |
          pnpm run smoke:browser:install
          pnpm run smoke:browser
        continue-on-error: true
