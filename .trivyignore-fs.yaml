# Trivy ignore list — ТОЛЬКО для джобы `trivy-fs` (наши файлы: локфайлы, секреты,
# IaC/Dockerfile'ы репозитория). Подключается явным `--ignorefile`.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ КОРНЕВОЙ .trivyignore. Тот же принцип, что у
# `.trivyignore-deps.yaml`: разные периметры — разные списки. Плюс две причины,
# специфичные именно для `trivy-fs`:
#
#   · корневой файл ПЛОСКИЙ и адресует запись ТОЛЬКО по id, без пути. Единственное,
#     что здесь нужно подавить (DS002), есть в ЛЮБОМ Dockerfile без `USER`, — запись
#     без пути погасила бы её заодно и в нашем прикладном `Dockerfile`, где стоит
#     `USER nonroot` и где возврат к root обязан валить гейт. Формат `.trivyignore.yaml`
#     умеет `paths` — ровно тот «точный инструмент», на который указывала запись
#     триажа SEC-32 в `docs/security/pipeline.md`;
#   · корневой `.trivyignore` держит CVE базового ОБРАЗА и читается джобой
#     `trivy-image`. Для `trivy-fs` он ПУСТАЯ ПОДПИСКА: измерено 2026-09-09 тем же
#     пиненным Trivy 0.58.2 — прогон с ним и прогон с пустым ignorefile дают побитово
#     один и тот же набор находок. То есть перевод `trivy-fs` на свой список ничего
#     не разподавляет, а только перестаёт делать вид, что подавляет.
#
# ЧТО СЮДА МОЖНО. Только разобранное до «мы знаем, что это, и приняли решение», с
# указанием ПОЧЕМУ и ЧЕМ это закрывается. Не «шумит» и не «сканер придирается».
#
# ПОЧЕМУ ЗДЕСЬ НЕТ `expired_at` (в отличие от `.trivyignore-deps.yaml`). `trivy-deps`
# информационная — там протухшая запись просто возвращает находку в отчёт. `trivy-fs`
# БЛОКИРУЮЩАЯ, и протухшая запись здесь красит гейт всему репозиторию: проверено на
# этом же файле — запись с `expired_at` во вчерашнем дне подавлять перестаёт, находка
# возвращается и джоба падает. Это не напоминание, а бомба с часовым механизмом ровно
# того сорта, что уже восемь раз закрывал очередь мержа (шапка `.trivyignore`). Поэтому
# срок ревью тут живёт в комментарии и привязан к кирпичу, который закрывает долг.

misconfigurations:
  # --- deploy/caddy/Dockerfile → DS002 (AVD-DS-0002, HIGH) «Image user should not be 'root'» ---
  # Caddy в контейнере ходит под root — так собран апстримный `caddy:2-alpine`, у него нет
  # инструкции `USER`, а наша рантайм-стадия это ОН ЖЕ. То есть SEC-31 не добавил риска:
  # ровно этот контейнер ровно так же работал и до кирпича, когда приезжал строкой `image:`.
  # Изменилась только ВИДИМОСТЬ — раньше Dockerfile'а не существовало и `trivy-fs` сканировать
  # было нечего. Подавлять «новую находку» тут честно: новой является запись в отчёте, а не
  # положение дел.
  #
  # ПОЧЕМУ НЕ ЧИНИТСЯ ОДНОЙ СТРОКОЙ `USER`. Контейнер обязан слушать 80/443 (`ports:` в
  # `deploy/docker-compose.tls.yml`), а это привилегированные порты. Под non-root их даёт
  # только capability NET_BIND_SERVICE в ambient-наборе: у docker'а ambient не выставляется,
  # `cap_add` наполняет permitted-набор, который для non-root-uid пуст, а file capability
  # (`setcap` на бинаре) обезоружена стоящим там же `no-new-privileges:true`. Рабочий путь
  # один — увести Caddy на высокие порты внутри контейнера (`http_port`/`https_port` +
  # проброс `80:8080`/`443:8443`), а это меняет топологию портов единственного смотрящего в
  # интернет сервиса и задевает ACME и редиректы. Проверить это можно только на публичном
  # хосте с реальным доменом, поэтому — отдельным кирпичом **SEC-36**, а не довеском к SEC-31.
  #
  # ЧЕМ РИСК ЗАКРЫТ СЕЙЧАС. `deploy/docker-compose.tls.yml` для этого сервиса уже держит
  # `cap_drop: ALL` + `cap_add: [NET_BIND_SERVICE]` + `no-new-privileges:true` (SEC-12): у
  # процесса нет ни одной capability, кроме привязки к порту, — ни DAC_OVERRIDE, ни SETUID,
  # ни CHOWN. Это не равно non-root, но это НЕ голый root, и разрыв между ними здесь узкий.
  #
  # Область записи — один файл: `paths` проверен на обе стороны (с чужим путём находка
  # возвращается), так что регресс в прикладном `Dockerfile` эта запись не спрячет.
  # Ревью — вместе с SEC-36; снимать запись тем же PR, что закроет долг.
  - id: DS002
    paths:
      - 'deploy/caddy/Dockerfile'
    statement: >-
      Caddy runs as root to bind 80/443; mitigated by cap_drop ALL +
      NET_BIND_SERVICE + no-new-privileges in deploy/docker-compose.tls.yml.
      Non-root migration needs a port remap and is tracked as brick SEC-36.
