# Trivy ignore list — ТОЛЬКО для джобы `trivy-deps` (сторонние образы прода:
# postgres, caddy из deploy/docker-compose*.yml). Подключается явным `--ignorefile`.
#
# ФОРМАТ. Это `.trivyignore.yaml`, а не плоский список, и переход был не косметикой.
# Плоский формат адресует ТОЛЬКО по id, без пути — из-за чего пять CVE Go stdlib
# (см. блок `gosu-only` ниже) нельзя было подавить: они есть и в gosu, и в бинаре
# caddy, и запись «для gosu» спрятала бы их у caddy — ровно там, где риск настоящий.
# Прежняя версия файла честно называла это своим ограничением и указывала на этот
# формат как на решение. Здесь оно и применено: у записи есть `paths`.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ КОРНЕВОЙ .trivyignore. Корневой читают ещё и
# `trivy-fs`, и `trivy-image` — БЛОКИРУЮЩИЕ джобы над НАШИМ кодом и НАШИМ образом.
# Запись сюда чужого CVE ослабила бы заодно и их: один и тот же id, попавший потом в
# нашу базу, молча перестал бы валить гейт. Разные периметры — разные списки.
#
# ЧТО СЮДА МОЖНО. Только разобранное до «недостижимо в нашем рантайме» с указанием
# ПОЧЕМУ. Не «шумит» и не «чужое, значит не наше»: чужой код в нашем проде — это наш
# риск, просто чинится он бампом образа, а не патчем в этом репозитории.
#
# СРОК ГОДНОСТИ. У каждой записи стоит `expired_at: 2026-11-05` (три месяца от триажа).
# Просроченная запись перестаёт подавлять, и CVE снова появляется в отчёте — это
# НЕ поломка: джоба информационная, уронить гейт она не может. Смысл в том, что
# подавление here — решение со сроком, а не навсегда: к дате его надо пересмотреть
# (обычно вместе с бампом дайджестов, docs/security/image-pinning.md).
#
# СОЗНАТЕЛЬНО НЕ ПОДАВЛЕНО: CVE в Go-бинаре самого `caddy` (stdlib, x/net, x/text,
# grpc, cel-go, x/crypto). Caddy — единственный сервис, смотрящий в интернет, и его
# HTTP-стек обрабатывает запросы злоумышленника напрямую; «оно, наверное, не про наш
# путь» там не аргумент. Эти находки остаются видимыми до пересборки образа апстримом.

vulnerabilities:
  # --- postgres:16-alpine → /usr/local/bin/gosu (Go stdlib v1.24.6, x/sys v0.1.0) ---
  # gosu — сетап-утилита официального энтрипойнта: выполняется ОДИН раз на старте контейнера
  # (chown каталога данных → сброс привилегий до пользователя postgres) и завершается до того,
  # как БД примет хоть одно соединение. Она не слушает сокеты, не парсит недоверенный ввод и не
  # ходит в сеть; перечисленные CVE — в net/http, crypto/tls, archive/*, encoding/* и подобных
  # путях, которых у неё в рантайме нет. Фиксы опубликованы в Go, но апстрим postgres:16-alpine
  # ещё не пересобран — как только пересоберётся, эти записи станут мёртвыми и их надо удалить.
