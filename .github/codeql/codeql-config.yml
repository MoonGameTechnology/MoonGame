name: Void Dominion — CodeQL

# ЕДИНСТВЕННОЕ ПОДАВЛЕНИЕ, и оно с обоснованием. Пустой список фильтров лучше, чем
# «отключим, чтобы не мешало»: каждое исключение здесь стоит объяснять как решение.

query-filters:
  # `js/missing-rate-limiting` — ЛОЖНОЕ у нас, все 100% срабатываний.
  #
  # ПОЧЕМУ ЛОЖНОЕ. Запрос ищет ИЗВЕСТНЫЕ ему middleware (`express-rate-limit`,
  # `@fastify/rate-limit` и подобные) и, не найдя их, объявляет роут незащищённым.
  # У нас лимитер свой — `slidingWindowIpLimiter` (`packages/server/src/rateLimit.ts`),
  # и вызывается он ПЕРВОЙ строкой каждого auth-хендлера:
  #
  #     app.post('/auth/login', async (request, reply) => {
  #       if (rateLimited(request.ip)) { void reply.code(429); return { error: 'E_RATE_LIMIT' }; }
  #
  # Так во всех четырёх: /auth/register, /auth/login, /auth/recover, /auth/reset.
  # Опознать это CodeQL не может — для него `rateLimited` просто функция.
  #
  # ЧТО МЫ ТЕРЯЕМ И ЧЕМ ЗАКРЫТО. Исключение выключает запрос ЦЕЛИКОМ, то есть новый
  # auth-роут БЕЗ лимита CodeQL тоже не поймает. Поэтому подавление идёт в паре с
  # компенсирующим тестом `authApi.test.ts` → «каждый auth-роут отвечает 429 при
  # исчерпанном лимите»: он перебирает роуты таблицей и падает, если появится
  # незащищённый. Это сильнее исходного запроса — проверяется поведение, а не
  # присутствие известного пакета.
  #
  # КОГДА СНИМАТЬ. Если появится штатный middleware (`@fastify/rate-limit`) — убрать
  # этот блок и вернуть запрос: он снова начнёт приносить пользу.
  - exclude:
      id: js/missing-rate-limiting
