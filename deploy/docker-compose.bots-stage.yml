# Isolated bot playtest. Credentials/artifact paths are supplied by the operator;
# this stack never joins the production database network or publishes host ports.
name: moongame-bots-stage

# Distinct service aliases matter: Caddy also joins production, where `server`
# and `postgres` already name the production services.
services:
  stage-postgres:
    image: ${STAGE_POSTGRES_IMAGE:?Set the pinned stage PostgreSQL image}
    container_name: moongame-bots-stage-postgres
    restart: unless-stopped
    env_file:
      - path: ${STAGE_POSTGRES_ENV_FILE:?Set the private stage PostgreSQL env file}
        format: raw
    security_opt:
      - no-new-privileges:true
    # The official entrypoint needs chown/setuid/setgid while initializing PGDATA.
    # Match the production policy; the database process itself drops to postgres.
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - stage-pgdata:/var/lib/postgresql/data
    networks: [stage]
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

  stage-server:
    image: ${STAGE_SERVER_IMAGE:?Set the pinned stage server image}
    container_name: moongame-bots-stage-server
    restart: unless-stopped
    user: '65532:65532'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ${STAGE_SERVER_ENV_FILE:?Set the private stage server env file}
        format: raw
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    depends_on:
      stage-postgres:
        condition: service_healthy
    volumes:
      - ${STAGE_RELEASE_DIR:?Set the stage artifact directory}/client-dist:/app/prototype/dist:ro
      - ${STAGE_RELEASE_DIR:?Set the stage artifact directory}/server-dist:/app/packages/server/dist:ro
    tmpfs:
      - /app/playtest-logs:rw,nosuid,noexec,size=32m,uid=65532,gid=65532,mode=0700
      - /tmp:rw,nosuid,noexec,size=16m
    networks: [stage]
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

# Existing network also connects the HTTPS proxy to the stage server. The external
# volume prevents `compose down -v` from deleting the pre-existing stage database.
networks:
  stage:
    external: true
    name: moongame-bots-stage
volumes:
  stage-pgdata:
    external: true
    name: moongame-bots-stage-postgres
