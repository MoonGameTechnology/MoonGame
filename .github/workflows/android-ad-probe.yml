name: Native VK ad probe

on:
  workflow_dispatch:
  push:
    # Temporary manual diagnostic, never a signed game release or an automatic update.
    branches: [fix/vk-ad-diagnostics-20261117]
    paths:
      - 'mobile/minimal-ad/**'
      - 'mobile/vk-rewarded.json'
      - 'mobile/distribution.json'
      - 'localization/**'
      - '.github/workflows/android-ad-probe.yml'

permissions:
  contents: read

concurrency:
  group: native-vk-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.probe-android-user
      ANDROID_AVD_HOME: ${{ github.workspace }}/.probe-android-user/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked build tooling
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix mobile
      - name: Build native-only probe
        run: |
          {
            echo "VOID_VC=$(git rev-list --count HEAD)"
            echo "VOID_SHA=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"
          node mobile/minimal-ad/prepare.mjs "$RUNNER_TEMP/ad-probe" "$(git rev-list --count HEAD)" "$(git rev-parse HEAD)"
          cd "$RUNNER_TEMP/ad-probe"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify installed identity, signature, privacy and absence of game assets
        run: |
          export AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          export APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          node mobile/minimal-ad/verify.mjs "$RUNNER_TEMP/ad-probe/app/build/outputs/apk/debug/app-debug.apk" "$VOID_VC" "$VOID_SHA"
      - name: Upload manual diagnostic APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: void-vk-native-probe
          path: |
            ${{ runner.temp }}/ad-probe/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/ad-probe/app/build/outputs/apk/debug/app-debug.apk.verification.json
          if-no-files-found: error
      - name: Install emulator image for the native UI check
        run: |
          SDK_BIN="$ANDROID_HOME/cmdline-tools/latest/bin"
          test -x "$SDK_BIN/sdkmanager"
          "$SDK_BIN/sdkmanager" 'emulator' 'platform-tools' 'system-images;android-35;default;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$SDK_BIN/avdmanager" create avd --name vk-ad-probe --package 'system-images;android-35;default;x86_64' --path "$ANDROID_AVD_HOME/vk-ad-probe.avd" --force
          test -f "$ANDROID_AVD_HOME/vk-ad-probe.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/vk-ad-probe.avd" > "$ANDROID_AVD_HOME/vk-ad-probe.ini"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chmod a+rw /dev/kvm
      - name: Test the installed one-button app offline
        run: |
          curl --fail --proto '=https' --max-time 90 --output "$RUNNER_TEMP/game.apk" 'https://77-221-140-87.sslip.io/downloads/android/diagnostics/vk-game-5980-a03d03df.apk'
          printf '%s  %s\n' '54433d52f371558c5931c17bdc4b52696d443a39aa0c2b0c9d6a37360acff73e' "$RUNNER_TEMP/game.apk" | sha256sum -c -
          "$ANDROID_HOME/emulator/emulator" -avd vk-ad-probe -no-window -no-audio -no-boot-anim -no-snapshot -gpu software -memory 2048 -cores 2 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'tail -n 60 "$RUNNER_TEMP/emulator.log"' ERR
          python3 mobile/minimal-ad/smoke.py "$RUNNER_TEMP/ad-probe/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/game.apk"
