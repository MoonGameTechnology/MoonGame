name: Security scan

# Security pipeline. Runs a DIVERSE set of scanners on EVERY push (any branch) —
# different methods / data sources / surfaces, not clones — aggregates everything
# into ONE report, and posts it back (sticky PR comment, or a commit comment
# otherwise) + job summary + artifact.
#
# === GATING (SEC-1 ratchet) ===
#
# Triaged scanners are BLOCKING: semgrep, gitleaks, osv, trivy-fs, trivy-image.
# Baseline was fixed at ZERO findings (triage 2026-07-10: local gitleaks v8.18.4 +
# pnpm audit runs, CI runs of the pinned images — all clean; the only accepted
# suppressions are the justified base-image CVEs in .trivyignore). Their gate step
# fails the job on ANY non-zero scanner exit — findings AND scanner/infra failures
# both block (fail-secure, OWASP A10): a scanner that couldn't run can't certify.
# New suppressions go to .semgrepignore / .gitleaks.toml / .trivyignore WITH a
# reason + date (see docs/security/pipeline.md).
# Still informational (not yet triaged as bricks): codeql, trufflehog, trivy-deps,
# kics, dependency-review, dependency-check, zizmor, scorecard, and the `check` job (its
# blocking twin lives in ci.yml).
#
# Each scan job writes a `status-<key>.json` sentinel AFTER the scan with the real
# exit code / outcome. The summarizer LEADS with a scan-confirmation table built from
# those sentinels, so a silently-failed scanner is flagged "⚠️ NOT confirmed" instead
# of a misleading quiet "0 findings" (anti fail-open — audit F-08).
#
# === SECURITY HARDENING (SEC-3) ===
#
# Hardening (self-flagged by the zizmor job): every checkout sets
# `persist-credentials: false` (jobs only read — none push — so the workflow token
# must not linger in .git/config, artifact/credential-persistence), and every
# `${{ steps.*.outcome }}` is read via an `env:` var (`$VAR`) instead of being
# expanded inline into a `run:` shell (template-injection prevention).
#
# Actions are SHA-pinned (SD-6.1 / F-16) with a trailing `# vN` for readability.
#
# Docker images are pinned by sha256 digest (supply-chain integrity):
#   - All scanners: semgrep, gitleaks, trufflehog, osv-scanner, trivy, syft, zizmor, kics
#   - Reason: prevents tag reuse / MITM / registry compromise attacks
#   - Update method: ./.github/scripts/update-image-digests.sh (re-pin every month)
#   - See docs/security/image-pinning.md for details
#   - Last updated: 2026-08
#
# Variables and secrets (least privilege):
#   - Secrets ALWAYS use ${{ secrets.NAME }} (auto-masked in logs)
#   - Permissions: each job declares ONLY what it needs (contents/pull-requests/issues)
#   - Protected branches: main requires green checks + code review (prevents direct push)
#   - GITHUB_TOKEN (auto-rotated) used instead of long-lived PAT
#   - See docs/security/ci-variables.md for guidelines
#
# This workflow is itself checked by zizmor (GitHub Actions security scanner).
#
# === HARDEN-RUNNER (egress-policy: audit) ===
#
# ЗАЧЕМ. Почти каждая джоба ниже запускает ЧУЖОЙ docker-образ с примонтированным репозиторием.
# Именно этот вектор выстрелил в 2026-м дважды на тех самых сканерах: Trivy в марте, KICS
# 22 апреля — украденные publisher-креды, вредоносный образ под легитимным тегом, и
# отравленный бинарь тихо отправлял ВЫВОД СКАНА наружу, сохраняя рабочую поверхность.
# Дайджест-пины (см. выше) закрывают «подменили образ»; harden-runner отвечает на
# следующий вопрос — «а куда этот образ вообще ходит». Он снимает egress на уровне ядра
# (eBPF), поэтому видит и трафик контейнеров, запущенных внутри джобы.
#
# ЦЕНА, О КОТОРОЙ НАДО ЗНАТЬ. Это сторонний агент с доступом уровня ядра на каждом прогоне,
# и в audit-режиме он отправляет телеметрию о наших прогонах в SaaS вендора. Для пайплайна,
# посылка которого — «не доверяй чужому коду с нашими секретами», это осознанный размен, а
# не бесплатное усиление. Откат — удалить шаг, ничего больше от него не зависит.
#
# ПОЧЕМУ AUDIT, А НЕ BLOCK. Блокирующий режим обходится через DNS-over-HTTPS
# (GHSA-46g3-37rh-v698, Community-тариф) — то есть даёт не гарантию, а видимость с
# дополнительным риском сломать легитимный трафик сканеров. Сначала неделя наблюдений и
# список реальных эндпоинтов, потом уже разговор про block. Версия 2.19.4 — заведомо выше
# 2.16.0, где DoH-обход закрыли.
#
# === WHY THE WEEKLY SCHEDULE (SEC-10) ===
#
# Push-triggered scanning certifies a COMMIT, not a RUNNING DEPLOY. Our bases are
# digest-pinned, so a long-lived deploy keeps running the exact image that was scanned
# at merge time while the CVE feeds move under it — nobody looks until someone happens
# to push. The Monday cron re-scans `main` (same jobs, same blocking gates) so a CVE
# published against the pinned base surfaces as a failed run within a week, not
# whenever the next commit lands.

# `pull_request` добавлен ради ФОРКОВ: этот воркфлоу подписан на push, а пуш в форк
# происходит в чужом репозитории — то есть PR от внешнего контрибьютора приезжал бы
# вообще без сканеров, ровно в тот момент, когда чужой код нужно проверять больше всего.
# Права у форк-прогона урезаны (нет секретов, нет `security-events: write`), поэтому
# заливка SARIF и постинг комментария там тихо не сработают — оба шага под
# `continue-on-error`, а сами гейты (semgrep/gitleaks/osv/trivy) от прав не зависят.
on:
  push:
    branches: ['**']
  pull_request:
  # Merge queue: очередь собирает временную ветку «свежий main + этот PR» и ждёт на НЕЙ
  # отчёта от required-чеков — но воркфлоу попадает туда, только если подписан на
  # `merge_group`. Без этой строки очередь не увидит отсюда ни одного сканера и будет
  # ждать до таймаута, а PR останется висеть. Ровно то же соображение, что в ci.yml;
  # там строка уже стоит, здесь её не хватало — и очередь вставала на первом же PR.
  merge_group:
  schedule:
    # Monday 05:17 UTC. Off-the-hour minute: GitHub drops cron runs queued at peak
    # times (:00 is the worst), and a rescan that silently never ran is fail-open.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  # Ключ по ИМЕНИ ВЕТКИ, а не по github.ref: на pull_request ref выглядит как
  # refs/pull/N/merge и не схлопнулся бы с прогоном от push той же ветки — вышло бы два
  # полных прогона сканеров на каждый коммит в PR.
  group: security-${{ github.head_ref || github.ref }}
  # На `merge_group` не отменяем — по той же причине, что в `ci.yml`: у всех попыток
  # поставить тот же PR на ту же базу имя ветки очереди совпадает, и повторная постановка
  # гасила бы ещё идущий прогон прошлой записи. Отменённый required-чек очередь считает
  # провалом и выбрасывает PR с `CI_FAILURE`, хотя код зелёный.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions: {}

jobs:
  check:
    name: lint + typecheck + test + audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm run check
        id: check
        continue-on-error: true
        run: pnpm run check
      # pnpm audit retired: npm shut down both audit endpoints (HTTP 410, 2026-07).
      # SCA over the lockfiles is carried by the BLOCKING osv job below (osv.dev
      # mirrors GHSA) and by ci.yml's OSV step — no separate audit sentinel.
      - name: sentinels
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "{\"check\":\"$CHECK_OUTCOME\"}" > check-status.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-check
          path: |
            check-status.json
          if-no-files-found: warn

  semgrep:
    name: SAST patterns (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep — custom rule unit tests (SEC-2)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 \
            semgrep --test .semgrep/rules --metrics=off
      - name: semgrep
        id: scan
        run: |
          set +e
          # --error → exit 1 on findings (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep@sha256:06938c1f365d3f67b8cedd8bc117607ae64253f88a0e768e9da9408548927dd6 \
            semgrep scan --config=p/typescript --config=p/javascript --config=p/security-audit --config=.semgrep/rules \
            --error --sarif --output=semgrep.sarif --metrics=off
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s semgrep.sarif ] || ok=false
          echo "{\"key\":\"semgrep\",\"ok\":$ok,\"exit\":$rc}" > status-semgrep.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-semgrep
          path: |
            semgrep.sarif
            status-semgrep.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Semgrep is a blocking scanner (SEC-1): findings or scan failure (exit $RC). Fix the finding or suppress WITH justification (.semgrepignore / nosemgrep + reason)."
            exit 1
          fi

  codeql:
    name: SAST dataflow (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: javascript-typescript
      - id: cqa
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: codeql
          output: codeql-out
          upload: always
      - name: sentinel
        if: always()
        env:
          CQA_OUTCOME: ${{ steps.cqa.outcome }}
        run: |
          ok=false
          if [ "$CQA_OUTCOME" = "success" ]; then ok=true; fi
          echo "{\"key\":\"codeql\",\"ok\":$ok}" > status-codeql.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-codeql
          path: |
            codeql-out/**/*.sarif
            status-codeql.json
          if-no-files-found: warn

  gitleaks:
    name: Secrets — tree (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks
        id: scan
        run: |
          set +e
          # Pinned by digest (= v8.18.4), snapped live from the registry API and re-checked.
          # exits 1 on leaks by default (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/src --no-git --redact \
            --report-format sarif --report-path gitleaks.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s gitleaks.sarif ] || ok=false
          echo "{\"key\":\"gitleaks\",\"ok\":$ok,\"exit\":$rc}" > status-gitleaks.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-gitleaks
          path: |
            gitleaks.sarif
            status-gitleaks.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Gitleaks is a blocking scanner (SEC-1): leak found or scan failure (exit $RC). Rotate the secret; allowlist ONLY known-public fixtures via .gitleaks.toml WITH justification."
            exit 1
          fi

  trufflehog:
    name: Secrets — history + verify (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history — the differentiator vs Gitleaks (--no-git)
          persist-credentials: false
      - name: trufflehog
        continue-on-error: true
        run: |
          set +e
          # stderr НЕ выбрасывается: stdout уже занят NDJSON-отчётом, поэтому лог джобы —
          # единственное место, где может уцелеть причина падения скана (было `2>/dev/null`).
          docker run --rm -v "$PWD:/src" -w /src trufflesecurity/trufflehog@sha256:de8ef4e573653b30c002e3491bf0484d23e31b73fe5519db6b395408e6834d4f \
            git file:///src --json --no-update > trufflehog.json
          rc=$?
          set -e
          # ЛЮБОЙ ненулевой код — это «скан не отработал», а не «нашлись секреты: без
          # `--fail` находки на код выхода не влияют (упавший скан выходит 1). Проверки
          # `[ -s trufflehog.json ]`, как у остальных сканеров, здесь быть НЕ может: пустой
          # файл — легитимный чистый результат, она давала бы ложную тревогу. Поэтому
          # ливнес-проверка идёт по коду выхода — она ортогональна находкам.
          ok=true; [ "$rc" -eq 0 ] || ok=false
          echo "{\"key\":\"trufflehog\",\"ok\":$ok,\"exit\":$rc}" > status-trufflehog.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trufflehog
          path: |
            trufflehog.json
            status-trufflehog.json
          if-no-files-found: warn

  osv:
    name: SCA — osv.dev (OSV-Scanner)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        id: scan
        run: |
          set +e
          # Pinned by digest (= v1.9.1): a tag can be re-pointed, a digest cannot.
          # exits 1 on vulnerabilities by default (blocking, SEC-1)
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/google/osv-scanner@sha256:36dea1baa2b34df3ee911d712e6a774eff04cc8b25789e0e6837d40759afaeab \
            --lockfile=pnpm-lock.yaml --lockfile=mobile/package-lock.json \
            --format=sarif --output=osv.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s osv.sarif ] || ok=false
          echo "{\"key\":\"osv\",\"ok\":$ok,\"exit\":$rc}" > status-osv.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-osv
          path: |
            osv.sarif
            status-osv.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::OSV-Scanner is a blocking scanner (SEC-1): vulnerability found or scan failure (exit $RC). Update the dependency; ignore ONLY with [[IgnoredVulns]] in osv-scanner.toml WITH justification + expiry."
            exit 1
          fi

  trivy-fs:
    name: Vuln + IaC — files (Trivy fs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy fs
        id: scan
        run: |
          set +e
          # Pinned by digest (= 0.58.2): a tag can be re-pointed, a digest cannot.
          # --exit-code 1 → exit 1 on findings (blocking, SEC-1); .trivyignore applies
          docker run --rm -v "$PWD:/src" -w /src aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 \
            fs --scanners vuln,secret,misconfig --exit-code 1 --format sarif --output trivy.sarif .
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s trivy.sarif ] || ok=false
          echo "{\"key\":\"trivy-fs\",\"ok\":$ok,\"exit\":$rc}" > status-trivy-fs.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-fs
          path: |
            trivy.sarif
            status-trivy-fs.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Trivy fs is a blocking scanner (SEC-1): finding or scan failure (exit $RC). Fix it; suppress ONLY via .trivyignore WITH CVE-id, reason and review date."
            exit 1
          fi

  trivy-image:
    name: Vuln — built image base OS (Trivy image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build image
        continue-on-error: true
        run: docker build -t void-dominion:scan .
      - name: trivy image + image SBOM
        id: scan
        run: |
          set +e
          # Pinned by digest: aquasec/trivy (= 0.58.2) + anchore/syft (= v1.20.0).
          # --exit-code 1 → exit 1 on findings (blocking, SEC-1); .trivyignore applies
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 image --exit-code 1 --format sarif --output trivy-image.sarif void-dominion:scan
          rc=$?
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" -w /out \
            anchore/syft@sha256:b46e597614ddc78621e560af3fabf9346e35462ea1c886a38b30bcc7ca601a73 scan void-dominion:scan -o cyclonedx-json=sbom-image.cdx.json
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s trivy-image.sarif ] || ok=false
          echo "{\"key\":\"trivy-image\",\"ok\":$ok,\"exit\":$rc}" > status-trivy-image.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-image
          path: |
            trivy-image.sarif
            sbom-image.cdx.json
            status-trivy-image.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: gate — blocking on findings or scan failure (SEC-1)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ "$RC" != "0" ]; then
            echo "::error::Trivy image is a blocking scanner (SEC-1): finding or scan/build failure (exit $RC). Fix the image; suppress ONLY via .trivyignore WITH CVE-id, reason and review date."
            exit 1
          fi

  trivy-deps:
    name: Vuln — third-party prod images (Trivy image)
    # SEC-11: `trivy-image` above scans OUR image only. Production runs two more
    # containers nobody was scanning — postgres and caddy from deploy/. Their refs are
    # READ OUT OF THE COMPOSE FILES here (not a second hardcoded list), so a digest bump
    # in deploy/ can't drift away from what CI actually scans.
    # Informational on landing (the SEC-6 pattern): third-party base images carry CVEs
    # we don't control, so this becomes blocking only after the first triage — otherwise
    # an upstream advisory would redden `main` with nothing to fix in this repo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy image — postgres/caddy referenced by deploy/
        id: scan
        continue-on-error: true
        run: |
          set +e
          mkdir -p trivy-deps-sarif
          # Only the two base compose files: docker-compose.release.yml pins OUR image,
          # which trivy-image already scans at build time.
          refs=$(grep -hE '^[[:space:]]+image: ' deploy/docker-compose.yml deploy/docker-compose.tls.yml |
            awk '{print $2}' | sort -u)
          echo "refs to scan:"; echo "$refs"
          rc=0
          fail=0
          i=0
          for ref in $refs; do
            i=$((i + 1))
            # No docker-socket mount: these are registry refs, so Trivy pulls them itself
            # (the socket is only needed for the locally-built image in trivy-image).
            # --exit-code 1 → findings are visible in $rc; the gate stays informational.
            # --ignorefile: СВОЙ список подавлений (.trivyignore-deps), не корневой.
            # Корневой обслуживает блокирующие trivy-fs/trivy-image над нашим кодом и
            # образом; чужой CVE, записанный туда, ослабил бы заодно и их (SEC-14).
            docker run --rm -v "$PWD:/out" -w /out \
              aquasec/trivy@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56 image --exit-code 1 --format sarif \
              --ignorefile .trivyignore-deps \
              --output "trivy-deps-sarif/trivy-deps-$i.sarif" "$ref"
            r=$?
            # Отличаем НАХОДКИ от СБОЯ: `--exit-code 1` даёт ровно 1, когда CVE найдены;
            # всё остальное ненулевое (не спулился образ, нет сети, сдох сканер) — это
            # «скан не состоялся». Раньше оба случая сливались в один rc, и упавший пул
            # одного из двух образов проходил как «просканировано» — а предупреждение
            # внизу ещё и списывало это на найденные CVE.
            case $r in
              0) ;;
              1) rc=1 ;;
              *) fail=$r ;;
            esac
          done
          set -e
          ok=true
          [ "$fail" -eq 0 ] || ok=false
          [ "$i" -gt 0 ] || ok=false          # grep matched nothing ⇒ scanned nothing
          # По одному SARIF на КАЖДУЮ ссылку: непустого каталога мало — при двух образах
          # отчёт от первого маскировал бы полное отсутствие второго.
          [ "$(ls -1 trivy-deps-sarif | wc -l)" -eq "$i" ] || ok=false
          echo "{\"key\":\"trivy-deps\",\"ok\":$ok,\"exit\":$rc,\"fail\":$fail}" > status-trivy-deps.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-trivy-deps
          path: |
            trivy-deps-sarif/*.sarif
            status-trivy-deps.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-deps-sarif
          category: trivy-deps
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
          FAIL: ${{ steps.scan.outputs.fail }}
        run: |
          # Сбой скана и найденные CVE — РАЗНЫЕ сообщения: раньше упавший пул образа
          # печатался как «Trivy нашёл CVE», то есть авария маскировалась под находку.
          if [ "$FAIL" != "0" ]; then
            echo "::error::trivy-deps: скан НЕ состоялся (код $FAIL) — образ не спулился или сканер не отработал. Сентинел помечен ok:false, отчёт покажет «НЕ подтверждён»."
          fi
          if [ "$RC" != "0" ]; then
            echo "::warning::Trivy found CVEs in the third-party prod images (exit $RC). Informational for now — triage them, then flip this job to blocking (SEC-11)."
          fi

  kics:
    name: IaC — Docker Compose (KICS)
    # ЗАЧЕМ ОТДЕЛЬНЫЙ ДВИЖОК. У Trivy misconfig НЕТ формата Docker Compose (он умеет
    # Dockerfile/k8s/terraform/cloudformation/helm/ARM), поэтому рантайм-постура прода —
    # привилегии, лимиты, дефолты паролей, healthcheck'и в `deploy/docker-compose*.yml` —
    # до сих пор не проверялась НИКЕМ и держалась ревью плюс чек-листом в deploy/README.md.
    # Это записано поправкой A05 в docs/security/scanner-coverage-2026-07-26.md и стоило
    # нам живого бага: `POSTGRES_PASSWORD:-void` в прод-пути никто не поймал.
    #
    # ПРО КОМПРОМЕТАЦИЮ ОБРАЗА. 22.04.2026 в checkmarx/kics залили вредоносные образы по
    # украденным publisher-кредам; отравленный бинарь сохранял рабочую поверхность и
    # экфильтровал ВЫВОД СКАНА. Поэтому пин строго по дайджесту и осознанный выбор тега:
    # взят `v2.1.20-alpine`, чей дайджест побайтово совпадает с доинцидентной публикацией
    # (03.03.2026) и не входит в список отравленных, опубликованный Docker. Плавающие
    # `latest`/`alpine` не берём принципиально.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ДВЕ ЛОВУШКИ KICS, обе стоили красной джобы — не убирай, не проверив.
      #
      # 1. Расширение. KICS опознаёт Docker Compose ТОЛЬКО по `.yaml` (его апстрим-док
      #    platforms.md; та же беда у Ansible — Checkmarx/kics#7110, про compose — #1981),
      #    а у нас все три файла `.yml`. Переименовывать нельзя: на имена завязаны
      #    install-ubuntu.sh, verify-image.sh и полдюжины мест в доках — боевой деплой.
      #    Поэтому копии с нужным расширением делаются ВНУТРИ джобы, а пути в SARIF ниже
      #    возвращаются к настоящим файлам.
      # 2. Значение `--type`. В апстрим-доке KICS написано `docker-compose`, и CLI такое
      #    значение ОТВЕРГАЕТ: печатает справку и выходит с 126. Рабочее значение —
      #    `DockerCompose`, как перечислено в выводе `kics scan --help`. Документация
      #    разошлась с бинарём; источник истины — справка самого образа.
      - name: собрать .yaml-копии compose-файлов
        id: prep
        run: |
          set -euo pipefail
          mkdir -p kics-src kics-out
          chmod 777 kics-out # контейнер пишет отчёт своим uid — как в dast-zap
          n=0
          for f in deploy/docker-compose*.yml; do
            [ -e "$f" ] || continue
            cp "$f" "kics-src/$(basename "$f" .yml).yaml"
            n=$((n + 1))
          done
          echo "copied=$n" >> "$GITHUB_OUTPUT"
          ls -1 kics-src
      - name: kics
        id: scan
        env:
          COPIED: ${{ steps.prep.outputs.copied }}
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src \
            checkmarx/kics@sha256:990ae994fbbe59760c8e4f7e89b1193a39a0c2968909058ec29335cb6d80efc1 \
            scan -p /src/kics-src -o /src/kics-out --report-formats sarif,json \
            --type DockerCompose --no-progress
          rc=$?
          set -e
          ok=true
          case $rc in 125 | 126 | 127) ok=false ;; esac # образ не стянулся / не запустился
          # «Просканировал НОЛЬ файлов» — не находка, а сломанная конфигурация, и молчать
          # о ней нельзя: пустой отчёт неотличим от чистого. Ровно тот же приём, что у
          # trivy-deps («grep matched nothing ⇒ scanned nothing»).
          scanned=$(jq -r '.files_scanned // 0' kics-out/results.json 2>/dev/null || echo 0)
          [ "$scanned" -ge "${COPIED:-1}" ] || ok=false
          echo "{\"key\":\"kics\",\"ok\":$ok,\"exit\":$rc,\"scanned\":$scanned}" > status-kics.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "scanned=$scanned" >> "$GITHUB_OUTPUT"
      # SARIF ссылается на копии (kics-src/*.yaml), которых в репозитории нет — аннотации
      # Code Scanning указывали бы в пустоту. Возвращаем пути к настоящим файлам.
      - name: вернуть пути в SARIF к deploy/*.yml
        if: always()
        run: |
          set -euo pipefail
          [ -f kics-out/results.sarif ] || exit 0
          jq '(.. | objects | select(has("uri")) | .uri) |=
                (if startswith("kics-src/") then
                   sub("^kics-src/"; "deploy/") | sub("\\.yaml$"; ".yml")
                 else . end)' \
            kics-out/results.sarif > kics-out/results.fixed.sarif
          mv kics-out/results.fixed.sarif kics-out/results.sarif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-kics
          path: |
            kics-out/results.sarif
            kics-out/results.json
            status-kics.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: kics-out/results.sarif
          category: kics
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
          SCANNED: ${{ steps.scan.outputs.scanned }}
          COPIED: ${{ steps.prep.outputs.copied }}
        run: |
          # Сломанный скан и найденные проблемы — РАЗНЫЕ сообщения. Первое валит джобу
          # намеренно (она информационная, поэтому мерж не блокирует, но краснеет и видна),
          # второе только предупреждает до триажа базовой линии.
          if [ "$SCANNED" -lt "${COPIED:-1}" ]; then
            if [ "$RC" = "126" ] || [ "$RC" = "127" ] || [ "$RC" = "125" ]; then
              echo "::error::kics: контейнер не отработал (код $RC) — образ не запустился ЛИБО CLI отверг аргументы и напечатал справку. Сверь флаги с выводом \`kics scan --help\` в логе шага выше."
            else
              echo "::error::kics: просканировано $SCANNED из $COPIED compose-файлов — скан НЕ состоялся. Проверь, что копии имеют расширение .yaml и что --type принят (правильное значение: DockerCompose)."
            fi
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "::warning::KICS нашёл проблемы в compose ($SCANNED файлов, exit $RC). Информационно: разобрать базовую линию, затем перевести в блокирующие (SEC-1)."
          fi

  dependency-review:
    name: SCA — что вносит ЭТОТ PR (Dependency Review)
    # ЧЕМ ОТЛИЧАЕТСЯ ОТ OSV. Блокирующий `osv` смотрит на lockfile ЦЕЛИКОМ и отвечает
    # «в проекте есть уязвимая зависимость». Это действие диффает граф зависимостей базы
    # и головы и отвечает на другой вопрос — «уязвимость приехала ИМЕННО В ЭТОМ PR».
    # Разница практическая: первое говорит, что чинить, второе — что откатывать и кому
    # идти разбираться. Данные при этом почти те же (GHSA против osv.dev, который GHSA
    # зеркалит), так что как ДЕТЕКТОР сверх osv это добавляет мало — ценность в атрибуции
    # и в том, что через него позже включается лицензионная политика (`deny-licenses`),
    # которой сейчас нет ни у одного сканера в пайплайне.
    #
    # ТОЛЬКО НА PR: вне pull_request диффать нечего, базы для сравнения не существует.
    # Сводный отчёт знает про это (`prOnly`) и печатает «⏭ пропущено», а не «НЕ подтверждён».
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write # для comment-summary-in-pr: on-failure
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: dependency review
        id: scan
        continue-on-error: true # информационная до триажа (SEC-1)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Комментарий ТОЛЬКО при находке: в обычном случае канал отчётности один —
          # sticky-комментарий summarizer'а, второй бот в треде был бы шумом. Но если PR
          # реально вносит уязвимую зависимость, сказать об этом надо там, где смотрят.
          comment-summary-in-pr: on-failure
          # Лицензионная политика НЕ включена намеренно: `deny-licenses` — решение
          # команды, а не сканера, и ошибка в нём блокирует PR из-за ТРАНЗИТИВНОЙ
          # зависимости, которую никто не выбирал. Включать отдельным кирпичом, когда
          # политика будет выбрана.
      - name: sentinel
        if: always()
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          # ОГОВОРКА: в отличие от docker-сканеров это действие НЕ различает «нашёл» и
          # «сломался» — оба дают outcome=failure. Пишем outcome как есть и говорим об
          # этом вслух, вместо того чтобы делать вид, будто сигнал точный.
          ok=true
          case "$OUTCOME" in success | failure) ;; *) ok=false ;; esac
          rc=0
          [ "$OUTCOME" = 'success' ] || rc=1
          echo "{\"key\":\"dependency-review\",\"ok\":$ok,\"exit\":$rc,\"outcome\":\"$OUTCOME\"}" \
            > status-dependency-review.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-dependency-review
          path: status-dependency-review.json
          if-no-files-found: warn
      - name: report — informational (not yet blocking)
        if: always()
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$OUTCOME" != 'success' ]; then
            echo "::warning::Dependency Review: PR вносит уязвимую зависимость ЛИБО действие не отработало (outcome=$OUTCOME) — оно эти случаи не различает, смотри лог шага. Информационно до триажа."
          fi

  dependency-check:
    name: SCA — NVD/CPE (OWASP Dependency-Check)
    # SEC-15. A SECOND SCA engine over the same dependencies, deliberately different from
    # OSV/Trivy: those resolve advisories by package identity (GHSA/OSV records keyed to an
    # ecosystem name), this one matches CPEs straight out of the NVD feed. Different
    # matching ⇒ different blind spots, which is the whole reason the pipeline runs a
    # diverse set rather than clones.
    #
    # KNOWN COST, ACCEPTED ON LANDING:
    #   - CPE matching is noisy on npm (a package whose name collides with some vendor's
    #     product inherits its CVEs), so this is INFORMATIONAL until triaged — same
    #     ratchet as trivy-deps/dast-zap. Do not make it blocking before that triage.
    #   - It cannot read `pnpm-lock.yaml` (its Node analyzers understand package.json +
    #     npm/yarn lockfiles). So we install first and let it walk the real node_modules
    #     tree — without that install this job would quietly scan almost nothing, which
    #     is the fail-open shape this pipeline exists to avoid.
    #   - The NVD feed download is slow; the data dir is cached across runs and only
    #     incrementally updated, hence the generous timeout.
    #
    # MEASURED ON THE FIRST LIVE RUN (2026-07-30, run 30579763480) — two corrections:
    #   1. It died after 40 minutes with `Unable to obtain an exclusive lock on the H2
    #      database` + `No documents exist` (exit 13). Cause: the container does not run as
    #      the runner's user, so it could not write/lock the H2 store inside the
    #      bind-mounted data dir. Fixed by running it as the runner uid:gid — the
    #      upstream-documented invocation — so the mounted dir it must own is actually
    #      writable. (The empty 185-byte cache that run saved is why the key prefix is
    #      now v2: the old prefix would restore that poisoned empty dir forever.)
    #   2. NOT ON EVERY PUSH any more. Even failing took 40 minutes; a successful first
    #      feed sync is not going to be dramatically cheaper, and a scanner that slow does
    #      not belong in the PR feedback loop. It runs on the weekly cron and on manual
    #      dispatch, where its duration costs nobody anything. On a push it is SKIPPED BY
    #      DESIGN — and the summarizer knows that, so it prints "⏭ skipped", not the
    #      "NOT confirmed" alarm (which must keep meaning "a scan that should have run
    #      didn't"). Move it back onto push only if a measured run turns out to be fast.
    # ТОЛЬКО крон и ручной запуск. Раньше условие было «не push» — с появлением
    # `pull_request` в триггерах это молча означало бы 40-минутную джобу на КАЖДЫЙ PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # Rate-limit token for the NVD API. Without it the feed sync crawls and the job is
      # useless, so a missing secret is reported as an UNCONFIRMED scan (below) instead of
      # a quiet green.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restore the NVD database between runs: a cold sync pulls the whole feed, a warm
      # one is incremental. Immutable key + prefix restore-keys = always save a fresh
      # entry, always start from the newest previous one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dc-data
          key: dc-nvd-v2-${{ github.run_id }}
          restore-keys: dc-nvd-v2-
      - name: dependency-check
        id: scan
        if: env.NVD_API_KEY != ''
        continue-on-error: true
        run: |
          set +e
          mkdir -p dc-data dc-report
          # `-u` is load-bearing, not hygiene: without it the container user cannot lock
          # the H2 database inside the bind-mounted data dir, and the run dies after
          # ~40 minutes of feed sync with "Unable to obtain an exclusive lock" (seen live,
          # exit 13). Running as the runner's own uid:gid — the upstream-documented
          # invocation — makes both mounted dirs writable, since the runner created them.
          # Image digest-pinned (A08), resolved from the registry — same rule as every
          # other scanner here. The key goes in as an argument read from the environment;
          # Actions masks the secret in logs.
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$PWD/dc-data:/usr/share/dependency-check/data" \
            owasp/dependency-check@sha256:ad169904106250816059f113d374d63a49a7cb0fd2c5e476d05c4fb814cc77b9 \
            --scan /src --out /src/dc-report --format SARIF \
            --project void-dominion --nvdApiKey "$NVD_API_KEY"
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s dc-report/dependency-check-report.sarif ] || ok=false
          echo "{\"key\":\"dependency-check\",\"ok\":$ok,\"exit\":$rc}" > status-dependency-check.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
      - name: no key — report as NOT confirmed
        if: env.NVD_API_KEY == ''
        run: |
          echo "::warning::NVD_API_KEY is not set — Dependency-Check did not run. Add the secret (Settings → Secrets and variables → Actions)."
          echo '{"key":"dependency-check","ok":false,"exit":"no-key"}' > status-dependency-check.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-dependency-check
          path: |
            dc-report/dependency-check-report.sarif
            status-dependency-check.json
          if-no-files-found: warn
      - name: upload to code scanning
        if: env.NVD_API_KEY != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: dc-report/dependency-check-report.sarif
          category: dependency-check
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
        run: |
          if [ -n "$RC" ] && [ "$RC" != "0" ]; then
            echo "::warning::Dependency-Check finished with exit $RC (findings or scan failure). Informational until the CPE false-positive pass is done (SEC-15)."
          fi

  dast-zap:
    name: DAST — running server (ZAP baseline)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: boot the server (in-memory, no DATABASE_URL — auth/gate default off, F1)
        run: |
          pnpm run dev:server > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8787/health > /dev/null || { echo "::error::server did not become healthy"; cat server.log; exit 1; }
      - name: zap baseline
        id: scan
        continue-on-error: true
        run: |
          set +e
          # The zaproxy image runs as a non-root `zap` user; the runner's checkout dir
          # isn't writable by it, so ZAP would silently fail to write zap.yaml/reports
          # (AccessDeniedException) while the job still reported success. Mount a
          # dedicated, world-writable subdir instead of the whole repo root.
          mkdir -p zap-wrk
          chmod 777 zap-wrk
          # ПОЧЕМУ ДВЕ ПОПЫТКИ. ZAP тут флапает: 04.08.2026 на PR #480 демон не
          # поднялся, `zap-baseline.py` напечатал «Failed to access summary file
          # /home/zap/zap_out.json», отчёт не создался — и всё это за 34 секунды
          # вместо обычных 6 минут. Семь минут назад, на #479, тот же образ по тому же
          # дайджесту отработал штатно. То есть это не поломка конфигурации, а срыв
          # старта демона под нагрузкой раннера.
          # Без повтора шаг ниже красил бы джобу примерно на каждом десятом PR, и
          # красный DAST быстро стал бы фоном, который никто не читает. Повтор — ровно
          # для того, чтобы красный цвет означал «DAST правда не отработал», а не
          # «сегодня не повезло». Две попытки, потому что одна независимая ретрая
          # уводит вероятность ложной тревоги на порядок; больше — уже маскировка
          # настоящей поломки.
          run_zap() {
            # ghcr.io/zaproxy/zaproxy@sha256 pin snapped live from the registry API (SEC-3).
            # --network host: the target is the bare node process on the runner, not a
            # container — ZAP reaches it via localhost like trivy-image reaches the socket.
            docker run --rm --network host -v "$PWD/zap-wrk:/zap/wrk/:rw" \
              ghcr.io/zaproxy/zaproxy@sha256:8d387b1a63e3425beef4846e39719f5af2a787753af2d8b6558c6257d7a577a2 \
              zap-baseline.py -t http://localhost:8787 -r zap-report.html -J zap-report.json
          }
          # Вывод контейнера дублируется в файл: он уезжает в артефакт, поэтому
          # следующий срыв можно будет разобрать постфактум, а не собирать заново.
          run_zap 2>&1 | tee zap-wrk/zap-stdout.log
          rc=${PIPESTATUS[0]}
          attempts=1
          if [ ! -s zap-wrk/zap-report.json ]; then
            echo "::warning::ZAP не создал отчёт с первой попытки (exit $rc) — повтор, см. zap-stdout.log в артефакте"
            run_zap 2>&1 | tee -a zap-wrk/zap-stdout.log
            rc=${PIPESTATUS[0]}
            attempts=2
          fi
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          # Ключевая проверка: «отчёта нет» ⇒ скана НЕ БЫЛО. Пустой результат
          # неотличим от чистого — тот же приём, что у kics (files_scanned) и
          # trivy-deps (grep matched nothing).
          [ -s zap-wrk/zap-report.json ] || ok=false
          echo "{\"key\":\"dast-zap\",\"ok\":$ok,\"exit\":$rc,\"attempts\":$attempts}" > status-dast-zap.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
      - name: stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-dast-zap
          path: |
            zap-wrk/zap-report.html
            zap-wrk/zap-report.json
            zap-wrk/zap-stdout.log
            status-dast-zap.json
            server.log
          if-no-files-found: warn
      - name: report — informational (not yet blocking)
        env:
          RC: ${{ steps.scan.outputs.rc }}
          OK: ${{ steps.scan.outputs.ok }}
          ATTEMPTS: ${{ steps.scan.outputs.attempts }}
        run: |
          # ЗАЧЕМ ЭТОТ ШАГ. До него сорванный скан оставлял джобу ЗЕЛЁНОЙ: сам
          # `zap-baseline.py` стоит под `continue-on-error`, а гейта не было вовсе.
          # Провал жил ровно в одном месте — в строке «НЕ подтверждён» сводного
          # комментария, то есть замечал его только тот, кто дочитал таблицу. Так и
          # вышло: на #480 DAST не отработал, а джоба отчиталась успехом.
          # Теперь сорванный скан красит джобу. Мерж это не блокирует (dast-zap
          # информационный, а авто-постановка в очередь принимает UNSTABLE) — но
          # красное видно в списке чеков, а не только в тексте отчёта.
          # Сломанный скан и НАЙДЕННЫЕ проблемы — разные сообщения, как у kics.
          if [ "$OK" != 'true' ]; then
            echo "::error::ZAP не отработал: отчёт не создан за $ATTEMPTS попытк(и) (exit $RC). Это НЕ «уязвимостей нет» — DAST на этом коммите не проверял ничего. Разбор: zap-stdout.log и server.log в артефакте report-dast-zap."
            exit 1
          fi
          if [ "$ATTEMPTS" != '1' ]; then
            echo "::warning::ZAP отработал со второй попытки — первая сорвалась. Если это станет постоянным, проблема не в флапе."
          fi
          if [ "$RC" != '0' ]; then
            echo "::warning::ZAP baseline нашёл проблемы (exit $RC). Информационно: разобрать базовую линию, затем перевести в блокирующие (SEC-1)."
          fi

  sbom:
    name: SBOM — files (Syft / CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: syft sbom
        continue-on-error: true
        run: |
          set +e
          # Pinned by digest (= v1.20.0).
          docker run --rm -v "$PWD:/src" -w /src anchore/syft@sha256:b46e597614ddc78621e560af3fabf9346e35462ea1c886a38b30bcc7ca601a73 \
            scan dir:/src -o cyclonedx-json=sbom.cdx.json
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s sbom.cdx.json ] || ok=false
          echo "{\"key\":\"sbom\",\"ok\":$ok,\"exit\":$rc}" > status-sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-sbom
          path: |
            sbom.cdx.json
            status-sbom.json
          if-no-files-found: warn

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          docker run --rm -e GH_TOKEN -v "$PWD:/src" -w /src ghcr.io/zizmorcore/zizmor@sha256:d1117e5dbd9ee4970644067b534ab6ab50371f3c6f7f4d05446eb603a6e78f48 \
            --format sarif . > zizmor.sarif
          rc=$?
          set -e
          ok=true; case $rc in 125 | 126 | 127) ok=false ;; esac
          [ -s zizmor.sarif ] || ok=false
          echo "{\"key\":\"zizmor\",\"ok\":$ok,\"exit\":$rc}" > status-zizmor.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-zizmor
          path: |
            zizmor.sarif
            status-zizmor.json
          if-no-files-found: warn
      - name: upload to code scanning
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  scorecard:
    name: Repo posture (OpenSSF Scorecard)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # posture checks are meaningful on the default branch
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sc
        continue-on-error: true
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - name: sentinel
        if: always()
        env:
          SC_OUTCOME: ${{ steps.sc.outcome }}
        run: |
          ok=false
          if [ "$SC_OUTCOME" = "success" ]; then ok=true; fi
          echo "{\"key\":\"scorecard\",\"ok\":$ok}" > status-scorecard.json
      - name: upload to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-scorecard
          path: |
            scorecard.sarif
            status-scorecard.json
          if-no-files-found: warn

  report:
    name: summarize + report
    needs:
      [
        check,
        semgrep,
        codeql,
        gitleaks,
        trufflehog,
        osv,
        trivy-fs,
        trivy-image,
        trivy-deps,
        dependency-check,
        dast-zap,
        sbom,
        zizmor,
        scorecard,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit comments
      pull-requests: write # PR comments
      issues: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: reports
      - name: summarize
        run: node .github/scripts/summarize-security.mjs reports security-report.md
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # Нужен, чтобы отличить «пропущено по дизайну» (schedule-only джоба на push)
          # от «скан не подтверждён».
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
      - name: job summary
        run: cat security-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-report
          path: |
            security-report.md
            reports/**/*.sarif
            reports/**/*.cdx.json
          if-no-files-found: warn
      - name: post report (sticky PR comment or commit comment)
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // Weekly rescan (SEC-10) runs on `main`, where there is no PR to stick the
            // comment to — it would drop a fresh commit comment on the same head commit
            // every Monday. The run's own red/green + job summary is the signal there.
            if (context.eventName === 'schedule') {
              core.info('scheduled rescan — report stays in the job summary/artifacts');
              return;
            }
            const marker = '<!-- void-security-report -->';
            const body = marker + '\n' + fs.readFileSync('security-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let prs = [];
            try {
              const res = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
              prs = res.data.filter((p) => p.state === 'open');
            } catch (e) {
              core.warning('PR lookup failed: ' + e.message);
            }
            if (prs.length) {
              for (const pr of prs) {
                const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: pr.number, per_page: 100 });
                const existing = comments.find((c) => c.body && c.body.includes(marker));
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
                }
              }
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: sha, body });
            }
